<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A bug report is a reproduction contract</title>
  <desc id="desc">A practical review card that separates a bounded observation from diagnosis, impact, priority, and fix verification, then maps condition, transitions, evidence, and recheck criteria.</desc>
  <rect width="1200" height="1200" fill="#07111f"/>
  <rect x="44" y="44" width="1112" height="1112" rx="34" fill="#0d1b2d" stroke="#294866" stroke-width="3"/>

  <text x="84" y="108" fill="#8de5d1" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="700" letter-spacing="1.2">BUG-REPORT REVIEW · CONSERVATIVE GUIDANCE</text>
  <text x="84" y="166" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800">A reproduction contract, not a screenshot</text>
  <text x="84" y="211" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="21">Bind the observation to a condition, path, evidence boundary, and recheck.</text>

  <rect x="84" y="250" width="1032" height="130" rx="22" fill="#291f25" stroke="#f28baa" stroke-width="2"/>
  <text x="116" y="292" fill="#ffb2ca" font-family="system-ui, sans-serif" font-size="20" font-weight="800">DO NOT LET ONE FRAME INHERIT MISSING CLAIMS</text>
  <text x="116" y="333" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18">observation ≠ diagnosis ≠ population impact ≠ priority ≠ fix verification</text>
  <text x="116" y="362" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="16">A screenshot may support one evidence lane; it does not silently complete the others.</text>

  <text x="84" y="435" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="20" font-weight="800">BUILD THE CONTRACT IN FOUR PARTS</text>

  <rect x="84" y="465" width="494" height="174" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="121" cy="506" r="18" fill="#85d8ff"/>
  <text x="121" y="513" text-anchor="middle" fill="#07111f" font-family="system-ui, sans-serif" font-size="16" font-weight="900">1</text>
  <text x="153" y="514" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">FREEZE THE CONDITION</text>
  <text x="116" y="554" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">build · route · role · state · data shape</text>
  <text x="116" y="590" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">write “unknown” instead of guessing</text>
  <text x="116" y="617" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="15">Use synthetic or minimized identifiers.</text>

  <rect x="622" y="465" width="494" height="174" rx="20" fill="#102d31" stroke="#54c8b1" stroke-width="2"/>
  <circle cx="659" cy="506" r="18" fill="#8de5d1"/>
  <text x="659" y="513" text-anchor="middle" fill="#092421" font-family="system-ui, sans-serif" font-size="16" font-weight="900">2</text>
  <text x="691" y="514" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">NAME THE TRANSITIONS</text>
  <text x="654" y="554" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">action · expected state · observed state</text>
  <text x="654" y="590" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="16" font-weight="700">one numbered, observable step at a time</text>
  <text x="654" y="617" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="15">Stop when declared preconditions diverge.</text>

  <rect x="84" y="674" width="494" height="174" rx="20" fill="#102d31" stroke="#54c8b1" stroke-width="2"/>
  <circle cx="121" cy="715" r="18" fill="#8de5d1"/>
  <text x="121" y="722" text-anchor="middle" fill="#092421" font-family="system-ui, sans-serif" font-size="16" font-weight="900">3</text>
  <text x="153" y="723" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">SEPARATE EVIDENCE</text>
  <text x="116" y="763" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">state · transition · system · repeat · contrast</text>
  <text x="116" y="799" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="16" font-weight="700">record attempts, limits, and redactions</text>
  <text x="116" y="826" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="15">No secrets, customer records, or payment data.</text>

  <rect x="622" y="674" width="494" height="174" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="659" cy="715" r="18" fill="#85d8ff"/>
  <text x="659" y="722" text-anchor="middle" fill="#07111f" font-family="system-ui, sans-serif" font-size="16" font-weight="900">4</text>
  <text x="691" y="723" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">DEFINE THE RECHECK</text>
  <text x="654" y="763" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">exact candidate · original path · acceptance</text>
  <text x="654" y="799" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">REPRODUCED · NOT REPRODUCED</text>
  <text x="654" y="826" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="15">Keep BLOCKED and NOT TESTED distinct.</text>

  <rect x="84" y="891" width="1032" height="163" rx="22" fill="#291f25" stroke="#f28baa" stroke-width="3"/>
  <text x="116" y="933" fill="#ffb2ca" font-family="system-ui, sans-serif" font-size="20" font-weight="800">RESERVE “FIX VERIFIED” FOR THE STRONGER RECORD</text>
  <text x="116" y="973" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17">identified repair candidate · original path rerun · expected checkpoint holds</text>
  <text x="116" y="1008" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17">adjacent failure paths checked · claim limited to the recorded attempts</text>
  <text x="116" y="1037" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="15">A merged change, new screenshot, or unrelated clean path is not fix verification.</text>

  <text x="84" y="1104" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="17">Original method card · no real defect, diagnosis, priority, or fix result.</text>
  <text x="1116" y="1104" text-anchor="end" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Alfred</text>
</svg>
