<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A deadline is one budget, not a timeout at every hop</title>
  <desc id="desc">A deadline-budget control card showing one caller-established budget shrinking across queueing, local work, downstream work, return time, retries, and cancellation. It recommends rejecting work that cannot finish usefully and measuring residual work after cancellation.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800">A deadline is one budget,</text>
  <text x="96" y="240" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800">not a timeout at every hop.</text>
  <text x="96" y="286" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="24">Carry remaining time forward. Never restart the caller’s original allowance.</text>

  <rect x="96" y="330" width="1008" height="102" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="371" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">CALLER-ESTABLISHED USEFULNESS DEADLINE</text>
  <text x="126" y="405" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="23">Every stage spends from this same shrinking end-to-end budget.</text>
  <text x="1000" y="390" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="800">T₀ → 0</text>

  <text x="96" y="484" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="750">Budget path</text>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="510" width="184" height="126" rx="18" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
    <text x="116" y="548" fill="#93c5fd" font-size="21" font-weight="800">1 · ADMIT</text>
    <text x="116" y="582" fill="#e5eefb" font-size="18">Reject if useful</text>
    <text x="116" y="610" fill="#e5eefb" font-size="18">completion cannot fit.</text>

    <path d="M288 573h28" stroke="#64748b" stroke-width="4"/><path d="m311 565 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="328" y="510" width="184" height="126" rx="18" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="348" y="548" fill="#fde68a" font-size="21" font-weight="800">2 · QUEUE</text>
    <text x="348" y="582" fill="#e5eefb" font-size="18">Charge residence;</text>
    <text x="348" y="610" fill="#e5eefb" font-size="18">re-check at dequeue.</text>

    <path d="M520 573h28" stroke="#64748b" stroke-width="4"/><path d="m543 565 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="560" y="510" width="184" height="126" rx="18" fill="#3c291d" stroke="#fb923c" stroke-width="2"/>
    <text x="580" y="548" fill="#fdba74" font-size="21" font-weight="800">3 · EXECUTE</text>
    <text x="580" y="582" fill="#e5eefb" font-size="18">Cap local and</text>
    <text x="580" y="610" fill="#e5eefb" font-size="18">downstream work.</text>

    <path d="M752 573h28" stroke="#64748b" stroke-width="4"/><path d="m775 565 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="792" y="510" width="184" height="126" rx="18" fill="#342342" stroke="#c084fc" stroke-width="2"/>
    <text x="812" y="548" fill="#d8b4fe" font-size="21" font-weight="800">4 · RETURN</text>
    <text x="812" y="582" fill="#e5eefb" font-size="18">Reserve time to</text>
    <text x="812" y="610" fill="#e5eefb" font-size="18">deliver or reconcile.</text>

    <path d="M984 573h28" stroke="#64748b" stroke-width="4"/><path d="m1007 565 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="1024" y="510" width="80" height="126" rx="18" fill="#43202a" stroke="#fb7185" stroke-width="2"/>
    <text x="1042" y="548" fill="#fda4af" font-size="18" font-weight="800">STOP</text>
    <text x="1042" y="582" fill="#e5eefb" font-size="15">Expired</text>
    <text x="1042" y="606" fill="#e5eefb" font-size="15">work</text>
    <text x="1042" y="628" fill="#e5eefb" font-size="15">must end.</text>
  </g>

  <rect x="96" y="674" width="492" height="250" rx="22" fill="#172338" stroke="#475569" stroke-width="2"/>
  <text x="126" y="722" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="750">Before another attempt</text>
  <g fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="21">
    <text x="126" y="768">• The operation is repeat-safe or reconcilable.</text>
    <text x="126" y="810">• Delay, execution, and return still fit.</text>
    <text x="126" y="852">• One layer owns the retry decision.</text>
    <text x="126" y="894">• The new cap cannot exceed the deadline.</text>
  </g>

  <rect x="612" y="674" width="492" height="250" rx="22" fill="#172338" stroke="#475569" stroke-width="2"/>
  <text x="642" y="722" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="750">After expiry or cancellation</text>
  <g fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="21">
    <text x="642" y="768">• Stop queued and expensive work.</text>
    <text x="642" y="810">• Cancel downstream fan-out where supported.</text>
    <text x="642" y="852">• Reconcile uncertain side effects by identity.</text>
    <text x="642" y="894">• Measure residual and late work explicitly.</text>
  </g>

  <rect x="96" y="958" width="1008" height="78" rx="18" fill="#0d1728" stroke="#334155" stroke-width="2"/>
  <text x="126" y="990" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">effective deadline = min(caller deadline, local hard deadline)</text>
  <text x="126" y="1019" fill="#b8c7df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">remaining budget = effective deadline − monotonic current time</text>

  <line x1="96" y1="1070" x2="1104" y2="1070" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1107" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Evidence boundary:</text>
  <text x="266" y="1107" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="19">Proposed method—not evidence that a production request path met its deadline.</text>
  <text x="96" y="1138" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="18">Original vector graphic · Original work by Alfred</text>
</svg>
