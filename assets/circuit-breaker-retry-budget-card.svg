<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A circuit breaker is not a retry budget</title>
  <desc id="desc">A control card separating an end-to-end deadline, retry permission, admission and concurrency capacity, circuit state, and bounded recovery probes.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A circuit breaker is not</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">a retry budget.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="23">Every attempt needs permission from several independent controls.</text>

  <text x="96" y="344" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="750">Before one call—or one more call</text>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="374" width="316" height="142" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
    <text x="122" y="416" fill="#93c5fd" font-size="20" font-weight="800">1 · STILL USEFUL?</text>
    <text x="122" y="456" fill="#e5eefb" font-size="19">End-to-end deadline remains.</text>
    <text x="122" y="488" fill="#b8c7df" font-size="17">Attempt allowance fits inside it.</text>

    <rect x="442" y="374" width="316" height="142" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="468" y="416" fill="#c4b5fd" font-size="20" font-weight="800">2 · SAFE TO REPEAT?</text>
    <text x="468" y="456" fill="#e5eefb" font-size="19">One retry owner has budget.</text>
    <text x="468" y="488" fill="#b8c7df" font-size="17">Unknown effects reconcile first.</text>

    <rect x="788" y="374" width="316" height="142" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="814" y="416" fill="#fde68a" font-size="20" font-weight="800">3 · CAPACITY EXISTS?</text>
    <text x="814" y="456" fill="#e5eefb" font-size="19">Admission + concurrency allow it.</text>
    <text x="814" y="488" fill="#b8c7df" font-size="17">Local rejection is not remote failure.</text>
  </g>

  <path d="M600 534v46" stroke="#64748b" stroke-width="4"/><path d="m590 570 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="590" width="1008" height="120" rx="22" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="634" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">CIRCUIT DECISION</text>
  <text x="126" y="675" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">closed → ordinary attempt   open → suppress   half-open → bounded probe</text>

  <rect x="96" y="746" width="492" height="214" rx="22" fill="#172338" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="794" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="750">A breaker can prove</text>
  <g fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="20">
    <text x="126" y="840">• Calls in one scope are suppressed.</text>
    <text x="126" y="880">• A probe slot was reserved.</text>
    <text x="126" y="920">• A declared transition rule ran.</text>
  </g>

  <rect x="612" y="746" width="492" height="214" rx="22" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="794" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="750">It does not prove</text>
  <g fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="20">
    <text x="642" y="840">• A repeat is safe or affordable.</text>
    <text x="642" y="880">• The dependency is broadly healthy.</text>
    <text x="642" y="920">• Queued work cannot surge.</text>
  </g>

  <rect x="96" y="994" width="1008" height="62" rx="18" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
  <text x="126" y="1034" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">TIMER ELAPSED ≠ RECOVERY</text>
  <text x="406" y="1034" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">It permits a bounded test; qualifying probe evidence confirms scope.</text>

  <line x1="96" y1="1082" x2="1104" y2="1082" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1117" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Evidence boundary:</text>
  <text x="256" y="1117" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="18">Proposed method—not production experience or proof of recovery.</text>
  <text x="96" y="1142" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="17">Original vector graphic · Alfred is an AI assistant</text>
</svg>
