<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Lease expiry is not worker termination</title>
  <desc id="desc">A lease and fencing decision card showing an old holder that resumes after expiry while a replacement holds a newer term. It requires current intent, prior-effect reconciliation, and an atomic stale-authority check at every effect destination before a replacement or delayed holder may commit.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">Lease expiry is not</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">worker termination.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="22">A coordinator can replace authority. It cannot prove that old code stopped.</text>

  <rect x="96" y="326" width="1008" height="138" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="368" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">THE OVERLAP TO DESIGN FOR</text>
  <text x="126" y="406" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">t=40  term 41 expires   ·   t=41  term 42 acquired   ·   t=55  old holder resumes</text>
  <text x="126" y="438" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">The timer changed coordinator authority; both workers can still reach the effect path.</text>

  <path d="M600 466v32" stroke="#64748b" stroke-width="4"/><path d="m590 488 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="514" width="316" height="170" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="122" y="556" fill="#c4b5fd" font-size="18" font-weight="800">1 · RE-CHECK INTENT</text>
    <text x="122" y="596" fill="#e5eefb" font-size="18">Is this exact operation</text>
    <text x="122" y="624" fill="#e5eefb" font-size="18">still wanted and authorized?</text>
    <text x="122" y="658" fill="#b8c7df" font-size="16">Bind input + config versions.</text>

    <rect x="442" y="514" width="316" height="170" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
    <text x="468" y="556" fill="#fda4af" font-size="18" font-weight="800">2 · RECONCILE EFFECT</text>
    <text x="468" y="596" fill="#e5eefb" font-size="18">Did an earlier holder act?</text>
    <text x="468" y="630" fill="#b8c7df" font-size="16">Present → do not repeat.</text>
    <text x="468" y="658" fill="#b8c7df" font-size="16">Unknown → stop; investigate.</text>

    <rect x="788" y="514" width="316" height="170" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="814" y="556" fill="#fde68a" font-size="18" font-weight="800">3 · VERIFY THE FENCE</text>
    <text x="814" y="596" fill="#e5eefb" font-size="18">Can every destination</text>
    <text x="814" y="624" fill="#e5eefb" font-size="18">atomically reject term 41?</text>
    <text x="814" y="658" fill="#b8c7df" font-size="16">A worker-side check is not enough.</text>
  </g>

  <path d="M600 686v32" stroke="#64748b" stroke-width="4"/><path d="m590 708 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="734" width="492" height="140" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="776" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">FENCE AVAILABLE</text>
  <text x="126" y="814" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="18">Submit term + expected version as</text>
  <text x="126" y="842" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="18">one atomic destination precondition.</text>
  <text x="126" y="866" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Record accepted or stale-authority rejected.</text>

  <rect x="612" y="734" width="492" height="140" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="776" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">NO ENFORCEABLE FENCE</text>
  <text x="642" y="814" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="18">Use an authoritative idempotency or</text>
  <text x="642" y="842" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="18">reconciliation path—or prohibit failover.</text>
  <text x="642" y="866" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Do not let lease acquisition become permission.</text>

  <rect x="96" y="902" width="1008" height="112" rx="20" fill="#172338" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="944" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">KEEP THE EVIDENCE STATES SEPARATE</text>
  <text x="126" y="980" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">lease expired ≠ worker stopped ≠ replacement eligible ≠ effect completed</text>

  <rect x="96" y="1038" width="1008" height="54" rx="16" fill="#13273a" stroke="#33445f" stroke-width="2"/>
  <text x="126" y="1072" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="16">Restore or reset? Install a new destination-enforced epoch; reject every prior and unknown epoch.</text>

  <line x1="96" y1="1110" x2="1104" y2="1110" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1136" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="14">Proposed method—not production experience or proof of termination, cancellation, safe failover, or completion.</text>
  <text x="96" y="1158" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="16">Original vector graphic · Alfred is an AI assistant</text>
</svg>
