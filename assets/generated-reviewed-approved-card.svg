<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Generated, reviewed, and approved are three different claims</title>
  <desc id="desc">A three-column release record separating AI-assisted origin, scoped review, and version-specific approval, followed by invalidation conditions and a narrow public disclosure.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081525"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 24px; font-weight: 750; letter-spacing: 3px; fill: #8dd8ff; }
      .headline { font-size: 57px; font-weight: 800; fill: #f7fbff; }
      .intro { font-size: 25px; fill: #c9d8e7; }
      .num { font-size: 22px; font-weight: 800; fill: #071522; }
      .label { font-size: 26px; font-weight: 800; fill: #f7fbff; }
      .claim { font-size: 21px; font-weight: 700; fill: #8dd8ff; }
      .body { font-size: 19px; fill: #d6e2ec; }
      .small { font-size: 17px; fill: #afc1d2; }
      .decision { font-size: 21px; font-weight: 750; fill: #f9d487; }
      .footer { font-size: 16px; fill: #9db1c3; }
    </style>
  </defs>

  <rect width="1200" height="1200" rx="34" fill="url(#background)"/>
  <rect x="42" y="42" width="1116" height="1116" rx="26" fill="none" stroke="#294866" stroke-width="2"/>

  <g class="sans">
    <text x="76" y="102" class="eyebrow">RELEASE RECORD · THREE CLAIMS</text>
    <text x="76" y="173" class="headline">Generated ≠ reviewed ≠ approved</text>
    <text x="76" y="218" class="intro">Record origin, inspection, and release authority separately.</text>

    <g transform="translate(76 270)">
      <rect width="330" height="490" rx="22" fill="#102b43" stroke="#2d607f" stroke-width="2"/>
      <circle cx="42" cy="43" r="21" fill="#8dd8ff"/>
      <text x="35" y="51" class="num">1</text>
      <text x="76" y="51" class="label">GENERATED</text>
      <text x="28" y="96" class="claim">Origin claim</text>
      <text x="28" y="132" class="body">
        <tspan x="28" dy="0">Which components used AI?</tspan>
        <tspan x="28" dy="31">• prose or outline</tspan>
        <tspan x="28" dy="31">• code or formulas</tspan>
        <tspan x="28" dy="31">• image, audio, video</tspan>
        <tspan x="28" dy="31">• summary or translation</tspan>
        <tspan x="28" dy="31">• source discovery or edits</tspan>
      </text>
      <line x1="28" y1="324" x2="302" y2="324" stroke="#2d607f"/>
      <text x="28" y="360" class="small">
        <tspan x="28" dy="0">Does not establish accuracy,</tspan>
        <tspan x="28" dy="26">rights, accessibility, quality,</tspan>
        <tspan x="28" dy="26">or readiness to publish.</tspan>
      </text>
    </g>

    <g transform="translate(435 270)">
      <rect width="330" height="490" rx="22" fill="#102b43" stroke="#2d607f" stroke-width="2"/>
      <circle cx="42" cy="43" r="21" fill="#8dd8ff"/>
      <text x="35" y="51" class="num">2</text>
      <text x="76" y="51" class="label">REVIEWED</text>
      <text x="28" y="96" class="claim">Scoped process claim</text>
      <text x="28" y="132" class="body">
        <tspan x="28" dy="0">What was actually checked?</tspan>
        <tspan x="28" dy="31">• claims against sources</tspan>
        <tspan x="28" dy="31">• code against named tests</tspan>
        <tspan x="28" dy="31">• rights and private data</tspan>
        <tspan x="28" dy="31">• captions and accessibility</tspan>
        <tspan x="28" dy="31">• final artifact identity</tspan>
      </text>
      <line x1="28" y1="324" x2="302" y2="324" stroke="#2d607f"/>
      <text x="28" y="360" class="small">
        <tspan x="28" dy="0">Record role, time, version,</tspan>
        <tspan x="28" dy="26">method, result, and material</tspan>
        <tspan x="28" dy="26">areas left unchecked.</tspan>
      </text>
    </g>

    <g transform="translate(794 270)">
      <rect width="330" height="490" rx="22" fill="#102b43" stroke="#2d607f" stroke-width="2"/>
      <circle cx="42" cy="43" r="21" fill="#f9d487"/>
      <text x="35" y="51" class="num">3</text>
      <text x="76" y="51" class="label">APPROVED</text>
      <text x="28" y="96" class="claim">Version-specific decision</text>
      <text x="28" y="132" class="body">
        <tspan x="28" dy="0">May this exact artifact move?</tspan>
        <tspan x="28" dy="31">• stable artifact identifier</tspan>
        <tspan x="28" dy="31">• current release state</tspan>
        <tspan x="28" dy="31">• completed review scopes</tspan>
        <tspan x="28" dy="31">• unresolved limitations</tspan>
        <tspan x="28" dy="31">• named destination</tspan>
      </text>
      <line x1="28" y1="324" x2="302" y2="324" stroke="#2d607f"/>
      <text x="28" y="360" class="small">
        <tspan x="28" dy="0">Approval belongs to one</tspan>
        <tspan x="28" dy="26">reviewed version and one</tspan>
        <tspan x="28" dy="26">bounded release decision.</tspan>
      </text>
    </g>

    <g transform="translate(76 800)">
      <rect width="1048" height="170" rx="22" fill="#0c2033" stroke="#6d5835" stroke-width="2"/>
      <text x="28" y="43" class="decision">REOPEN THE DECISION WHEN THE EVIDENCE CHANGES</text>
      <text x="28" y="82" class="body">
        <tspan x="28" dy="0">Changed claim or source · replaced media · new destination · failed processing</tspan>
        <tspan x="28" dy="31">unexpected redirect · remote artifact differs from the reviewed candidate</tspan>
      </text>
      <text x="28" y="147" class="small">A digest binds review to bytes. It does not prove the review was competent or complete.</text>
    </g>

    <g transform="translate(76 1005)">
      <text x="0" y="0" class="claim">NARROW PUBLIC LABEL</text>
      <text x="0" y="39" class="intro">“Drafted with AI assistance; sources and final copy reviewed before release.”</text>
      <text x="0" y="73" class="small">Use only when both halves are true. A public page still requires remote verification.</text>
    </g>

    <line x1="76" y1="1104" x2="1124" y2="1104" stroke="#294866"/>
    <text x="76" y="1136" class="footer">Original local checklist by Alfred, an AI assistant · not posted or published · no real release result</text>
  </g>
</svg>
