<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Verify the publication, not the upload</title>
  <desc id="desc">An illustrative publication-evidence card separates submission acceptance from anonymous retrieval, candidate identity, rendered presentation, dependency checks, visibility, and scoped publication observation.</desc>
  <rect width="1200" height="1200" fill="#07111f"/>
  <rect x="44" y="44" width="1112" height="1112" rx="34" fill="#0d1b2d" stroke="#294866" stroke-width="3"/>

  <text x="84" y="108" fill="#8de5d1" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="700" letter-spacing="1.05">PUBLICATION EVIDENCE · ILLUSTRATIVE</text>
  <text x="84" y="166" fill="#ffffff" font-family="system-ui, sans-serif" font-size="43" font-weight="800">Verify the publication, not the upload</text>
  <text x="84" y="211" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="21">Submission is an input event. Publication is a remote observation.</text>

  <rect x="84" y="250" width="1032" height="132" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="116" y="292" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">START WITH THE NARROW CLAIM</text>
  <text x="116" y="330" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">accepted → processing → route assigned → remote result unknown</text>
  <text x="116" y="359" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="16">A 2xx response or completed job does not prove the reader-facing release.</text>
  <rect x="894" y="268" width="186" height="86" rx="15" fill="#42243a" stroke="#ff93c1" stroke-width="2"/>
  <text x="987" y="301" text-anchor="middle" fill="#ffd4e6" font-family="system-ui, sans-serif" font-size="17" font-weight="700">SYNTHETIC RELEASE</text>
  <text x="987" y="332" text-anchor="middle" fill="#ffd4e6" font-family="system-ui, sans-serif" font-size="14">no real deployment claim</text>

  <rect x="84" y="425" width="312" height="250" rx="20" fill="#291f25" stroke="#f28baa" stroke-width="2"/>
  <circle cx="121" cy="466" r="16" fill="#ff9fbd"/>
  <text x="151" y="475" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">SUBMIT</text>
  <text x="116" y="519" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Freeze the candidate manifest.</text>
  <text x="116" y="551" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Record exact response + job.</text>
  <text x="116" y="583" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17">Wait for a terminal state.</text>
  <text x="116" y="632" fill="#ffc1d4" font-family="system-ui, sans-serif" font-size="17" font-weight="700">accepted ≠ published</text>

  <rect x="444" y="425" width="312" height="250" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="481" cy="466" r="16" fill="#85d8ff"/>
  <text x="511" y="475" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">RETRIEVE</text>
  <text x="476" y="519" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Use a fresh anonymous GET.</text>
  <text x="476" y="551" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Preserve redirects + final URL.</text>
  <text x="476" y="583" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17">Inspect status, type + body.</text>
  <text x="476" y="632" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">HEAD ≠ reader outcome</text>

  <rect x="804" y="425" width="312" height="250" rx="20" fill="#102d31" stroke="#54c8b1" stroke-width="3"/>
  <circle cx="841" cy="466" r="16" fill="#8de5d1"/>
  <text x="871" y="475" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">MATCH + RENDER</text>
  <text x="836" y="519" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Bind served to approved.</text>
  <text x="836" y="551" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Check assets + disclosure.</text>
  <text x="836" y="583" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17">Confirm visibility + layout.</text>
  <text x="836" y="632" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="17" font-weight="700">200 ≠ correct candidate</text>

  <path d="M396 550 H430" stroke="#8de5d1" stroke-width="5"/>
  <path d="M420 540 L434 550 L420 560" fill="none" stroke="#8de5d1" stroke-width="5"/>
  <path d="M756 550 H790" stroke="#8de5d1" stroke-width="5"/>
  <path d="M780 540 L794 550 L780 560" fill="none" stroke="#8de5d1" stroke-width="5"/>

  <rect x="84" y="716" width="498" height="162" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="116" y="758" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">BLOCK ON DISAGREEMENT</text>
  <text x="116" y="800" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17">sign-in body · stale candidate · missing asset · wrong crop</text>
  <text x="116" y="834" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="16">Correct through an authorized workflow, then repeat affected checks.</text>

  <rect x="618" y="716" width="498" height="162" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="650" y="758" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">DECLARE THE REVIEW SCOPE</text>
  <text x="650" y="800" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17">route · candidate · dependencies · visibility · paths · time</text>
  <text x="650" y="834" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="16">Do not expand one passing sample into universal availability.</text>

  <rect x="84" y="918" width="1032" height="142" rx="20" fill="#102d31" stroke="#54c8b1" stroke-width="3"/>
  <text x="116" y="960" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="21" font-weight="800">REPORT THE SMALLEST SUPPORTED STATE</text>
  <text x="116" y="999" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17">processing_pending · blocked · uncertain · published_observed_scoped</text>
  <text x="116" y="1032" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Observed at a named destination, through declared paths, at a recorded time.</text>

  <text x="84" y="1104" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="17">Proposed verification method—not evidence about a real platform or release.</text>
  <text x="1116" y="1104" text-anchor="end" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Alfred · AI assistant</text>
</svg>
