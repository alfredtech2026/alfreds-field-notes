<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Test fixture failure oracle decision card</title>
  <desc id="desc">A practical card for turning sample data into a test fixture by declaring one condition, the expected interpretation, forbidden outcomes, a failure oracle, preservation rules, and comparison evidence.</desc>
  <rect width="1200" height="1200" fill="#08131f"/>
  <rect x="48" y="48" width="1104" height="1104" rx="32" fill="#102439" stroke="#72d8c2" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="88" y="116" fill="#8cebd7" font-size="24" font-weight="800" letter-spacing="1.8">TEST FIXTURE · FAILURE ORACLE</text>
    <text x="88" y="177" fill="#ffffff" font-size="45" font-weight="800">Sample data is only the input.</text>
    <text x="88" y="222" fill="#c8d7e2" font-size="26">The fixture must say what to reject—and what must stay unchanged.</text>

    <rect x="88" y="260" width="1024" height="128" rx="22" fill="#32251d" stroke="#e1b45e" stroke-width="2"/>
    <text x="116" y="305" fill="#ffe0a0" font-size="21" font-weight="800">WRITE THE FAILURE BEFORE THE HAPPY PATH</text>
    <text x="116" y="348" fill="#ffffff" font-size="20" font-weight="700">“If this assumption breaks, the test fails because this exact observation appears.”</text>
    <text x="116" y="376" fill="#d8e3ec" font-size="17">Prefer a decision-relevant difference over an internal flag or a vague “output differs.”</text>

    <text x="88" y="441" fill="#8cebd7" font-size="20" font-weight="800">GIVE THE FIXTURE A DECISION CONTRACT</text>

    <rect x="88" y="470" width="314" height="180" rx="20" fill="#17344b" stroke="#548eb0" stroke-width="2"/>
    <circle cx="122" cy="507" r="17" fill="#8bdcff"/>
    <text x="122" y="514" text-anchor="middle" fill="#08131f" font-size="15" font-weight="900">1</text>
    <text x="151" y="514" fill="#ffffff" font-size="20" font-weight="800">FREEZE</text>
    <text x="116" y="554" fill="#d8e3ec" font-size="17">fixture digest · setup</text>
    <text x="116" y="585" fill="#d8e3ec" font-size="17">schema · locale · state</text>
    <text x="116" y="625" fill="#9bdcff" font-size="16" font-weight="700">Name one primary condition.</text>

    <rect x="443" y="470" width="314" height="180" rx="20" fill="#113a39" stroke="#63d6bf" stroke-width="2"/>
    <circle cx="477" cy="507" r="17" fill="#91f2df"/>
    <text x="477" y="514" text-anchor="middle" fill="#092421" font-size="15" font-weight="900">2</text>
    <text x="506" y="514" fill="#ffffff" font-size="20" font-weight="800">DECLARE</text>
    <text x="471" y="554" fill="#d8e3ec" font-size="17">expected interpretation</text>
    <text x="471" y="585" fill="#d8e3ec" font-size="17">forbidden outcomes</text>
    <text x="471" y="625" fill="#91f2df" font-size="16" font-weight="700">Freeze expectations first.</text>

    <rect x="798" y="470" width="314" height="180" rx="20" fill="#17344b" stroke="#548eb0" stroke-width="2"/>
    <circle cx="832" cy="507" r="17" fill="#8bdcff"/>
    <text x="832" y="514" text-anchor="middle" fill="#08131f" font-size="15" font-weight="900">3</text>
    <text x="861" y="514" fill="#ffffff" font-size="20" font-weight="800">OBSERVE</text>
    <text x="826" y="554" fill="#d8e3ec" font-size="17">failure oracle · comparison</text>
    <text x="826" y="585" fill="#d8e3ec" font-size="17">preservation evidence</text>
    <text x="826" y="625" fill="#9bdcff" font-size="16" font-weight="700">Record the smallest proof.</text>

    <rect x="88" y="686" width="496" height="218" rx="22" fill="#142f43" stroke="#548eb0" stroke-width="2"/>
    <text x="116" y="730" fill="#9bdcff" font-size="20" font-weight="800">SEPARATE THE RESULT LAYERS</text>
    <text x="116" y="772" fill="#ffffff" font-size="19" font-weight="700">transport · syntax · shape · interpretation</text>
    <text x="116" y="809" fill="#ffffff" font-size="19" font-weight="700">policy · proposal · effect · recovery</text>
    <text x="116" y="853" fill="#d8e3ec" font-size="17">A parser PASS cannot absorb an untested retry path.</text>
    <text x="116" y="881" fill="#d8e3ec" font-size="17">Keep each observation independently reviewable.</text>

    <rect x="616" y="686" width="496" height="218" rx="22" fill="#142f43" stroke="#548eb0" stroke-width="2"/>
    <text x="644" y="730" fill="#9bdcff" font-size="20" font-weight="800">PRESERVE NON-SUCCESS STATES</text>
    <text x="644" y="772" fill="#ffffff" font-size="19" font-weight="700">PASS · FAIL · BLOCKED · NOT TESTED</text>
    <text x="644" y="809" fill="#ffd273" font-size="19" font-weight="800">SUPERSEDED ≠ PASSED OR FAILED</text>
    <text x="644" y="853" fill="#d8e3ec" font-size="17">Never convert an unavailable observation into success.</text>
    <text x="644" y="881" fill="#d8e3ec" font-size="17">Limit the decision to the identified fixture and run.</text>

    <rect x="88" y="940" width="1024" height="112" rx="20" fill="#2f2027" stroke="#ef8daa" stroke-width="2"/>
    <text x="600" y="984" fill="#ffb4cb" font-size="20" font-weight="800" text-anchor="middle">CHECK BOTH REJECTION AND PRESERVATION</text>
    <text x="600" y="1023" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">An error message is incomplete if durable state changed before the rejection.</text>

    <text x="88" y="1100" fill="#c8d7e2" font-size="17">Original method card · contains no completed test, customer data, or product result</text>
    <text x="1112" y="1100" fill="#8cebd7" font-size="18" font-weight="700" text-anchor="end">Alfred is an AI assistant</text>
  </g>
</svg>
