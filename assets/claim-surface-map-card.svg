<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Claim-surface map method card</title>
  <desc id="desc">A six-gate review card for tracing one supported content correction across every declared surface of an exact release candidate.</desc>
  <rect width="1200" height="1200" fill="#f5f0e7"/>
  <rect x="54" y="54" width="1092" height="1092" rx="28" fill="#fffdf8" stroke="#172a3a" stroke-width="6"/>

  <text x="94" y="126" fill="#a33b2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="2">CONTENT CORRECTION · CLAIM-SURFACE MAP</text>
  <text x="94" y="196" fill="#172a3a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">Correct the meaning everywhere.</text>
  <text x="94" y="256" fill="#172a3a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">One edited caption is not closure.</text>
  <text x="94" y="306" fill="#4d5b66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26">Bind the supported correction, every surface, and exact delivery bytes.</text>

  <rect x="94" y="348" width="1012" height="112" rx="18" fill="#172a3a"/>
  <text x="126" y="394" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">SOURCE → PICTURE → SOUND → TIMED TEXT → DISCOVERY → PACKAGE</text>
  <text x="126" y="430" fill="#dce6ec" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Promotion and destination surfaces keep their own observed states.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="94" y="494" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="536" r="21" fill="#a33b2f"/>
    <text x="130" y="545" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="174" y="534" fill="#172a3a" font-size="27" font-weight="800">Define the meaning change</text>
    <text x="126" y="576" fill="#4d5b66" font-size="21">Record old and corrected meanings, basis,</text>
    <text x="126" y="604" fill="#4d5b66" font-size="21">scope, variants, candidate, and manifest.</text>

    <rect x="622" y="494" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="536" r="21" fill="#a33b2f"/>
    <text x="658" y="545" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="702" y="534" fill="#172a3a" font-size="27" font-weight="800">Inventory claim surfaces</text>
    <text x="654" y="576" fill="#4d5b66" font-size="21">Include visible, audible, timed, discovery,</text>
    <text x="654" y="604" fill="#4d5b66" font-size="21">package, promotion, and destination forms.</text>

    <rect x="94" y="652" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="694" r="21" fill="#a33b2f"/>
    <text x="130" y="703" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="174" y="692" fill="#172a3a" font-size="27" font-weight="800">Trace forward + backward</text>
    <text x="126" y="734" fill="#4d5b66" font-size="21">Follow the old meaning to every output;</text>
    <text x="126" y="762" fill="#4d5b66" font-size="21">trace final claims back to current support.</text>

    <rect x="622" y="652" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="694" r="21" fill="#a33b2f"/>
    <text x="658" y="703" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="702" y="692" fill="#172a3a" font-size="27" font-weight="800">Separate three decisions</text>
    <text x="654" y="734" fill="#4d5b66" font-size="21">Test basis, propagation, and cross-surface</text>
    <text x="654" y="762" fill="#4d5b66" font-size="21">meaning independently. Agreement is not truth.</text>

    <rect x="94" y="810" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="852" r="21" fill="#a33b2f"/>
    <text x="130" y="861" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="174" y="850" fill="#172a3a" font-size="27" font-weight="800">Inspect exact delivery</text>
    <text x="126" y="892" fill="#4d5b66" font-size="21">Search text, inspect picture, hear sound,</text>
    <text x="126" y="920" fill="#4d5b66" font-size="21">read timed text, metadata, and package.</text>

    <rect x="622" y="810" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="852" r="21" fill="#a33b2f"/>
    <text x="658" y="861" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="702" y="850" fill="#172a3a" font-size="27" font-weight="800">Invalidate affected proof</text>
    <text x="654" y="892" fill="#4d5b66" font-size="21">Give changed artifacts new identities;</text>
    <text x="654" y="920" fill="#4d5b66" font-size="21">reopen every dependent review surface.</text>
  </g>

  <rect x="94" y="978" width="1012" height="86" rx="18" fill="#f4ddd7" stroke="#a33b2f" stroke-width="3"/>
  <text x="126" y="1018" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800">HOLD RULE</text>
  <text x="295" y="1018" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">One stale, contradictory, blocked, untested, or uncertain surface holds.</text>
  <text x="126" y="1049" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Claim only the exact correction scope reviewed—and name what remains unknown.</text>

  <line x1="94" y1="1095" x2="1106" y2="1095" stroke="#c7cfd4" stroke-width="2"/>
  <text x="94" y="1129" fill="#4d5b66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Original explanatory work · Original work by Alfred · Local method card, not publication evidence</text>
</svg>
