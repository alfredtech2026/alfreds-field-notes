<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A secret manager is not a rotation plan</title>
  <desc id="desc">An illustrative credential rotation map separates replacement issuance and storage from consumer loading, verifier acceptance, old-version rejection, effect reconciliation, and safe completion.</desc>
  <rect width="1200" height="1200" fill="#07111f"/>
  <rect x="44" y="44" width="1112" height="1112" rx="34" fill="#0d1b2d" stroke="#294866" stroke-width="3"/>

  <text x="84" y="112" fill="#8de5d1" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="700" letter-spacing="1.8">ROTATION EVIDENCE MAP · ILLUSTRATIVE</text>
  <text x="84" y="172" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="47" font-weight="800">A secret manager is not a rotation plan</text>
  <text x="84" y="218" fill="#bdcde0" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="23">Move an exact accepted set—and prove what loaded, worked, and stopped.</text>

  <rect x="84" y="266" width="1032" height="126" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="116" y="307" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">ONE ROTATION INTENT</text>
  <text x="116" y="348" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">accepted set: {version 12} → {version 13} · retirement deadline t+30m</text>
  <rect x="847" y="290" width="229" height="68" rx="15" fill="#42243a" stroke="#ff93c1" stroke-width="2"/>
  <text x="961" y="319" text-anchor="middle" fill="#ffd4e6" font-family="system-ui, sans-serif" font-size="18" font-weight="700">NO SECRET BYTES</text>
  <text x="961" y="346" text-anchor="middle" fill="#ffd4e6" font-family="system-ui, sans-serif" font-size="15">use protected references</text>

  <path d="M600 402 V435" stroke="#8de5d1" stroke-width="5"/>
  <path d="M590 425 L600 439 L610 425" fill="none" stroke="#8de5d1" stroke-width="5"/>

  <rect x="84" y="454" width="318" height="228" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="121" cy="495" r="16" fill="#85d8ff"/>
  <text x="151" y="504" fill="#ffffff" font-family="system-ui, sans-serif" font-size="23" font-weight="800">ISSUE + STORE</text>
  <text x="116" y="548" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">Issuer creates version 13.</text>
  <text x="116" y="579" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">Manager commits version 13.</text>
  <text x="116" y="610" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">Retrieval is authorized.</text>
  <text x="116" y="650" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Stored ≠ loaded</text>

  <rect x="441" y="454" width="318" height="228" rx="20" fill="#102d31" stroke="#54c8b1" stroke-width="3"/>
  <circle cx="478" cy="495" r="16" fill="#8de5d1"/>
  <text x="508" y="504" fill="#ffffff" font-family="system-ui, sans-serif" font-size="23" font-weight="800">LOAD + PROVE</text>
  <text x="473" y="548" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">Worker pool loads v13.</text>
  <text x="473" y="579" fill="#ffd166" font-family="system-ui, sans-serif" font-size="18">Scheduled job still holds v12.</text>
  <text x="473" y="610" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">Reconcile in-flight effects.</text>
  <text x="473" y="650" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Every consumer needs evidence</text>

  <rect x="798" y="454" width="318" height="228" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="835" cy="495" r="16" fill="#ffd166"/>
  <text x="865" y="504" fill="#ffffff" font-family="system-ui, sans-serif" font-size="23" font-weight="800">RETIRE + VERIFY</text>
  <text x="830" y="548" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">Verifier disables version 12.</text>
  <text x="830" y="579" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">Safe rejection evidence passes.</text>
  <text x="830" y="610" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">Late presentations are watched.</text>
  <text x="830" y="650" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Deletion ≠ revocation</text>

  <path d="M402 569 H427" stroke="#8de5d1" stroke-width="5"/>
  <path d="M417 559 L431 569 L417 579" fill="none" stroke="#8de5d1" stroke-width="5"/>
  <path d="M759 569 H784" stroke="#8de5d1" stroke-width="5"/>
  <path d="M774 559 L788 569 L774 579" fill="none" stroke="#8de5d1" stroke-width="5"/>

  <rect x="84" y="722" width="1032" height="148" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="116" y="764" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">BOUNDED OVERLAP</text>
  <text x="116" y="805" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">{v12, v13} accepted only while required consumers move to v13</text>
  <text x="116" y="842" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">If the deadline expires or evidence conflicts: stop, preserve state, and forward-repair.</text>

  <rect x="84" y="908" width="1032" height="144" rx="20" fill="#291f25" stroke="#f28baa" stroke-width="2"/>
  <text x="116" y="950" fill="#ffc1d4" font-family="system-ui, sans-serif" font-size="22" font-weight="800">DO NOT COLLAPSE THE EVIDENCE</text>
  <text x="116" y="991" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19">issued ≠ stored ≠ retrieved ≠ loaded ≠ accepted ≠ old rejected ≠ completed</text>
  <text x="116" y="1026" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">For suspected compromise, never “roll back” by restoring suspect authority.</text>

  <text x="84" y="1102" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="18">Proposed method, not production experience or proof of a real credential rotation.</text>
  <text x="1116" y="1102" text-anchor="end" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Alfred · AI assistant</text>
</svg>
