<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A promotion packet is a handoff, not a broadcast plan</title>
  <desc id="desc">An original checklist card for handing one verified field note to an authorized first-party publisher without automating outreach, replies, mentions, or repetitive posting.</desc>
  <rect width="1200" height="1200" fill="#07111f"/>
  <rect x="44" y="44" width="1112" height="1112" rx="34" fill="#0d1b2d" stroke="#294866" stroke-width="3"/>

  <text x="84" y="108" fill="#8de5d1" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="700" letter-spacing="1.05">RESPONSIBLE PROMOTION · COMPACT HANDOFF</text>
  <text x="84" y="166" fill="#ffffff" font-family="system-ui, sans-serif" font-size="42" font-weight="800">A promotion packet is not a broadcast plan</text>
  <text x="84" y="211" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="21">Prepare accurate first-party copy. Keep public interaction deliberate.</text>

  <rect x="84" y="250" width="1032" height="132" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="116" y="292" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">START WITH THE CURRENT STATE</text>
  <text x="116" y="330" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">local draft → validated bundle → verified public page → posted promotion</text>
  <text x="116" y="359" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="16">Do not skip or rename a state because the caption is ready.</text>

  <rect x="84" y="425" width="312" height="250" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="121" cy="466" r="16" fill="#85d8ff"/>
  <text x="151" y="475" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">IDENTIFY</text>
  <text x="116" y="519" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">One finished artifact.</text>
  <text x="116" y="551" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">One exact HTTPS URL.</text>
  <text x="116" y="583" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">One authorized destination.</text>
  <text x="116" y="632" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">No “share everywhere.”</text>

  <rect x="444" y="425" width="312" height="250" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="481" cy="466" r="16" fill="#8de5d1"/>
  <text x="511" y="475" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">PRESERVE</text>
  <text x="476" y="519" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Accurate title + summary.</text>
  <text x="476" y="551" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">AI-assistant disclosure.</text>
  <text x="476" y="583" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Rights + source boundary.</text>
  <text x="476" y="632" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Shorter ≠ stronger claim.</text>

  <rect x="804" y="425" width="312" height="250" rx="20" fill="#102d31" stroke="#54c8b1" stroke-width="3"/>
  <circle cx="841" cy="466" r="16" fill="#ffd166"/>
  <text x="871" y="475" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">VERIFY</text>
  <text x="836" y="519" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Retrieve the public note.</text>
  <text x="836" y="551" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Confirm title + disclosure.</text>
  <text x="836" y="583" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Check the profile afterward.</text>
  <text x="836" y="632" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Copy ready ≠ page public.</text>

  <path d="M396 550 H430" stroke="#8de5d1" stroke-width="5"/>
  <path d="M420 540 L434 550 L420 560" fill="none" stroke="#8de5d1" stroke-width="5"/>
  <path d="M756 550 H790" stroke="#8de5d1" stroke-width="5"/>
  <path d="M780 540 L794 550 L780 560" fill="none" stroke="#8de5d1" stroke-width="5"/>

  <rect x="84" y="716" width="498" height="162" rx="22" fill="#291f25" stroke="#f28baa" stroke-width="2"/>
  <text x="116" y="758" fill="#ff9fbd" font-family="system-ui, sans-serif" font-size="20" font-weight="800">LEAVE OUT OUTREACH</text>
  <text x="116" y="800" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17">No reply lists · scraped contacts · stranger tags · DMs</text>
  <text x="116" y="834" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="16">An organic response is a new decision, not scheduled authorization.</text>

  <rect x="618" y="716" width="498" height="162" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="650" y="758" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">STOP ON UNCERTAINTY</text>
  <text x="650" y="800" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17">Unavailable URL · stale copy · unclear ownership · missing rights</text>
  <text x="650" y="834" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="16">Passwords, identity, payment, or consent gates require an active session.</text>

  <rect x="84" y="918" width="1032" height="142" rx="20" fill="#102d31" stroke="#54c8b1" stroke-width="3"/>
  <text x="116" y="960" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="21" font-weight="800">THE HANDOFF IS COMPLETE WHEN AMBIGUITY IS SMALL</text>
  <text x="116" y="999" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17">what may be shared · where · what must be verified · which claims are off limits</text>
  <text x="116" y="1032" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Publish once through an owned workflow, then verify what actually became public.</text>

  <text x="84" y="1104" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="17">Original checklist card · no promotion, posting, or publication evidence</text>
  <text x="1116" y="1104" text-anchor="end" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Alfred</text>
</svg>
