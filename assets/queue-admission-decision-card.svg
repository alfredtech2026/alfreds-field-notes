<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A queue is stored demand, not an admission policy</title>
  <desc id="desc">A queue-admission control card separating durable storage from payload validity, current eligibility, a fenced execution lease, authoritative effect evidence, and a terminal outcome. It shows rejection, cancellation, expiry, coalescing, reconciliation, and dead-lettering as explicit outcomes rather than treating storage as permission to execute.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A queue is stored demand,</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">not an admission policy.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="22">Durable acceptance proves bytes were stored—not that work should run.</text>

  <rect x="96" y="326" width="1008" height="112" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="368" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">STORED</text>
  <text x="126" y="404" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Exact item + class + deadline + policy version were durably accepted.</text>

  <path d="M600 440v38" stroke="#64748b" stroke-width="4"/><path d="m590 468 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>
  <text x="96" y="522" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="750">Before one attempt, re-evaluate every gate</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="548" width="316" height="158" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="122" y="590" fill="#c4b5fd" font-size="18" font-weight="800">1 · INTENT + VALUE</text>
    <text x="122" y="630" fill="#e5eefb" font-size="18">Still wanted and useful?</text>
    <text x="122" y="664" fill="#b8c7df" font-size="17">Cancellation and expiry are states.</text>

    <rect x="442" y="548" width="316" height="158" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="468" y="590" fill="#fde68a" font-size="18" font-weight="800">2 · DEADLINE + CAPACITY</text>
    <text x="468" y="630" fill="#e5eefb" font-size="18">Can wait + work + margin fit?</text>
    <text x="468" y="664" fill="#b8c7df" font-size="17">Use current age and drain evidence.</text>

    <rect x="788" y="548" width="316" height="158" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
    <text x="814" y="590" fill="#fda4af" font-size="18" font-weight="800">3 · VALIDITY + EFFECT</text>
    <text x="814" y="630" fill="#e5eefb" font-size="18">Authorized and safe to repeat?</text>
    <text x="814" y="664" fill="#b8c7df" font-size="17">Unknown prior effect → reconcile.</text>
  </g>

  <path d="M600 708v38" stroke="#64748b" stroke-width="4"/><path d="m590 736 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="762" width="492" height="132" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="806" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">ALL GATES PASS</text>
  <text x="126" y="844" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Lease one bounded attempt.</text>
  <text x="126" y="874" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">Fence ownership; bind effect evidence to intent.</text>

  <rect x="612" y="762" width="492" height="132" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="806" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">ANY GATE FAILS</text>
  <text x="642" y="844" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Reject, cancel, expire, or coalesce.</text>
  <text x="642" y="874" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">Preserve dead-lettered or indeterminate outcomes.</text>

  <rect x="96" y="930" width="1008" height="116" rx="20" fill="#172338" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="972" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">KEEP THE EVIDENCE STATES SEPARATE</text>
  <text x="126" y="1012" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">stored ≠ payload valid ≠ eligible ≠ leased ≠ effect recorded ≠ completed</text>

  <line x1="96" y1="1078" x2="1104" y2="1078" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1112" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="16">Proposed method—not production experience or proof of execution, authorization, or exactly-once effects.</text>
  <text x="96" y="1142" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="17">Original vector graphic · Alfred is an AI assistant</text>
</svg>
