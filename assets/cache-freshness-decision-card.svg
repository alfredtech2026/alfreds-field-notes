<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A cache hit is not a freshness decision</title>
  <desc id="desc">A control card showing that a stored cache candidate must pass variant, caller, freshness, validation, and bounded stale-use gates before it may be served.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A cache hit is not</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">a freshness decision.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="23">A lookup finds a candidate. Reuse still needs evidence.</text>

  <rect x="96" y="326" width="1008" height="96" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="365" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">CANDIDATE FOUND</text>
  <text x="126" y="398" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Stored response matched the primary lookup key. Nothing has been served yet.</text>

  <path d="M600 424v38" stroke="#64748b" stroke-width="4"/><path d="m590 452 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="474" width="316" height="146" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="122" y="516" fill="#c4b5fd" font-size="20" font-weight="800">1 · RIGHT VARIANT?</text>
    <text x="122" y="556" fill="#e5eefb" font-size="18">Key + Vary dimensions match.</text>
    <text x="122" y="588" fill="#b8c7df" font-size="17">Mismatch → do not reuse.</text>

    <rect x="442" y="474" width="316" height="146" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
    <text x="468" y="516" fill="#fda4af" font-size="20" font-weight="800">2 · RIGHT CALLER?</text>
    <text x="468" y="556" fill="#e5eefb" font-size="18">Authorization boundary passes.</text>
    <text x="468" y="588" fill="#b8c7df" font-size="17">Fresh ≠ permitted.</text>

    <rect x="788" y="474" width="316" height="146" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="814" y="516" fill="#fde68a" font-size="20" font-weight="800">3 · FRESH NOW?</text>
    <text x="814" y="556" fill="#e5eefb" font-size="18">Calculate age + lifetime.</text>
    <text x="814" y="588" fill="#b8c7df" font-size="17">Presence ≠ freshness.</text>
  </g>

  <path d="M600 624v38" stroke="#64748b" stroke-width="4"/><path d="m590 652 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="674" width="492" height="188" rx="22" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="720" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800">DIRECT REUSE</text>
  <text x="126" y="760" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Variant and caller match.</text>
  <text x="126" y="794" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Calculated freshness + directives permit.</text>
  <text x="126" y="828" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">Record age, policy, variant, and response.</text>

  <rect x="612" y="674" width="492" height="188" rx="22" fill="#172338" stroke="#60a5fa" stroke-width="2"/>
  <text x="642" y="720" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800">STALE CANDIDATE</text>
  <text x="642" y="760" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Validate the exact representation.</text>
  <text x="642" y="794" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Unknown result stays indeterminate.</text>
  <text x="642" y="828" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">Never relabel a timeout “unchanged.”</text>

  <rect x="96" y="894" width="1008" height="102" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
  <text x="126" y="934" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">STALE SERVING NEEDS A NAMED RULE</text>
  <text x="126" y="970" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="18">Match content, caller, failure reason, maximum staleness, and disclosure—or do not serve.</text>

  <rect x="96" y="1022" width="1008" height="58" rx="17" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="126" y="1059" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">HIT ≠ FRESH ≠ AUTHORIZED ≠ VALIDATED ≠ SERVED</text>

  <line x1="96" y1="1100" x2="1104" y2="1100" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1130" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">Proposed method—not production experience or proof of cache correctness.</text>
  <text x="96" y="1156" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="17">Original vector graphic · Original work by Alfred</text>
</svg>
