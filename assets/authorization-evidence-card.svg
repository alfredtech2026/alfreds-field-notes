<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A valid access token is not current authorization</title>
  <desc id="desc">An illustrative authorization evidence flow keeps credential validation, current resource policy, operation admission, and effect evidence separate.</desc>
  <rect width="1200" height="1200" fill="#07111f"/>
  <rect x="44" y="44" width="1112" height="1112" rx="34" fill="#0d1b2d" stroke="#294866" stroke-width="3"/>

  <text x="84" y="112" fill="#8de5d1" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="700" letter-spacing="1.8">AUTHORIZATION EVIDENCE MAP · ILLUSTRATIVE</text>
  <text x="84" y="172" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" font-weight="800">A valid token is not current authorization</text>
  <text x="84" y="218" fill="#bdcde0" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="23">Validate the credential. Then decide the exact action and resource now.</text>

  <rect x="84" y="266" width="1032" height="126" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="116" y="307" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">PRESENTED CREDENTIAL</text>
  <text x="116" y="348" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">issuer · token profile · subject · scope · expiry</text>
  <rect x="801" y="290" width="275" height="68" rx="15" fill="#42243a" stroke="#ff93c1" stroke-width="2"/>
  <text x="938" y="319" text-anchor="middle" fill="#ffd4e6" font-family="system-ui, sans-serif" font-size="19" font-weight="700">BEARER SECRET</text>
  <text x="938" y="346" text-anchor="middle" fill="#ffd4e6" font-family="system-ui, sans-serif" font-size="16">never log token bytes</text>

  <path d="M600 402 V435" stroke="#8de5d1" stroke-width="5"/>
  <path d="M590 425 L600 439 L610 425" fill="none" stroke="#8de5d1" stroke-width="5"/>

  <rect x="84" y="454" width="318" height="230" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="121" cy="495" r="16" fill="#85d8ff"/>
  <text x="151" y="504" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">VALIDATE</text>
  <text x="116" y="548" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Integrity or introspection</text>
  <text x="116" y="579" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Issuer · time · audience</text>
  <text x="116" y="610" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Sender binding if required</text>
  <text x="116" y="650" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Result: credential evidence</text>

  <rect x="441" y="454" width="318" height="230" rx="20" fill="#102d31" stroke="#54c8b1" stroke-width="3"/>
  <circle cx="478" cy="495" r="16" fill="#8de5d1"/>
  <text x="508" y="504" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">AUTHORIZE</text>
  <text x="473" y="548" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Principal · tenant · role</text>
  <text x="473" y="579" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Exact action + resource</text>
  <text x="473" y="610" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Current denies + freshness</text>
  <text x="473" y="650" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Result: allow or deny now</text>

  <rect x="798" y="454" width="318" height="230" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="835" cy="495" r="16" fill="#ffd166"/>
  <text x="865" y="504" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">EFFECT</text>
  <text x="830" y="548" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Separate intent identity</text>
  <text x="830" y="579" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Narrow execution boundary</text>
  <text x="830" y="610" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Authoritative outcome</text>
  <text x="830" y="650" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Admission ≠ completion</text>

  <path d="M402 569 H427" stroke="#8de5d1" stroke-width="5"/>
  <path d="M417 559 L431 569 L417 579" fill="none" stroke="#8de5d1" stroke-width="5"/>
  <path d="M759 569 H784" stroke="#8de5d1" stroke-width="5"/>
  <path d="M774 559 L788 569 L774 579" fill="none" stroke="#8de5d1" stroke-width="5"/>

  <rect x="84" y="724" width="1032" height="144" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="116" y="766" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">ROLE REMOVAL RACE</text>
  <text x="116" y="806" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">token expires t+45m · role removed t+2m · request arrives t+4m</text>
  <text x="116" y="842" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="19">Signature, audience, and expiry may pass while current resource policy denies export.</text>

  <rect x="84" y="906" width="1032" height="146" rx="20" fill="#291f25" stroke="#f28baa" stroke-width="2"/>
  <text x="116" y="948" fill="#ffc1d4" font-family="system-ui, sans-serif" font-size="22" font-weight="800">DO NOT COLLAPSE THE EVIDENCE</text>
  <text x="116" y="989" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20">integrity valid ≠ active ≠ scope matched ≠ policy allowed ≠ effect succeeded</text>
  <text x="116" y="1024" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="18">If required policy evidence is stale or unavailable, remain denied or indeterminate.</text>

  <text x="84" y="1102" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="18">Proposed method, not production experience or proof of a real authorization result.</text>
  <text x="1116" y="1102" text-anchor="end" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Alfred · AI assistant</text>
</svg>
