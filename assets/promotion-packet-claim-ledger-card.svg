<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Promotion-packet claim-ledger method card</title>
  <desc id="desc">A six-gate method card for binding reusable promotion copy to one exact release, scoped evidence, truthful lifecycle state, and one permitted first-party action.</desc>
  <rect width="1200" height="1200" fill="#f5f0e7"/>
  <rect x="54" y="54" width="1092" height="1092" rx="28" fill="#fffdf8" stroke="#172a3a" stroke-width="6"/>

  <text x="94" y="126" fill="#a33b2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="2">PROMOTION PACKET · CLAIM LEDGER</text>
  <text x="94" y="196" fill="#172a3a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">Reusable copy needs evidence.</text>
  <text x="94" y="256" fill="#172a3a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">Approval is not a lifecycle state.</text>
  <text x="94" y="306" fill="#4d5b66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26">Bind every line to one release, boundary, surface, action, and expiry.</text>

  <rect x="94" y="348" width="1012" height="112" rx="18" fill="#172a3a"/>
  <text x="126" y="394" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">RELEASE → CLAIMS → EVIDENCE → VARIANT → STATE → ACTION</text>
  <text x="126" y="430" fill="#dce6ec" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Prepared, queued, posted, and publicly verified are different facts.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="94" y="494" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="536" r="21" fill="#a33b2f"/>
    <text x="130" y="545" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="174" y="534" fill="#172a3a" font-size="27" font-weight="800">Define the envelope</text>
    <text x="126" y="576" fill="#4d5b66" font-size="21">Record exact release, truthful state, owner,</text>
    <text x="126" y="604" fill="#4d5b66" font-size="21">surface, permitted action, and cutoff.</text>

    <rect x="622" y="494" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="536" r="21" fill="#a33b2f"/>
    <text x="658" y="545" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="702" y="534" fill="#172a3a" font-size="27" font-weight="800">Inventory every claim</text>
    <text x="654" y="576" fill="#4d5b66" font-size="21">Separate identity, content, publication,</text>
    <text x="654" y="604" fill="#4d5b66" font-size="21">verification, rights, result, and permission.</text>

    <rect x="94" y="652" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="694" r="21" fill="#a33b2f"/>
    <text x="130" y="703" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="174" y="692" fill="#172a3a" font-size="27" font-weight="800">Bind scoped evidence</text>
    <text x="126" y="734" fill="#4d5b66" font-size="21">Name what supports each claim, what it</text>
    <text x="126" y="762" fill="#4d5b66" font-size="21">cannot support, and what makes it stale.</text>

    <rect x="622" y="652" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="694" r="21" fill="#a33b2f"/>
    <text x="658" y="703" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="702" y="692" fill="#172a3a" font-size="27" font-weight="800">Review each variant</text>
    <text x="654" y="734" fill="#4d5b66" font-size="21">Treat excerpts, link lines, previews, and</text>
    <text x="654" y="762" fill="#4d5b66" font-size="21">alt text as transformations, not copies.</text>

    <rect x="94" y="810" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="852" r="21" fill="#a33b2f"/>
    <text x="130" y="861" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="174" y="850" fill="#172a3a" font-size="27" font-weight="800">Verify availability claims</text>
    <text x="126" y="892" fill="#4d5b66" font-size="21">Freshly fetch the exact public release,</text>
    <text x="126" y="920" fill="#4d5b66" font-size="21">companions, disclosure, and discovery state.</text>

    <rect x="622" y="810" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="852" r="21" fill="#a33b2f"/>
    <text x="658" y="861" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="702" y="850" fill="#172a3a" font-size="27" font-weight="800">Decide one exact action</text>
    <text x="654" y="892" fill="#4d5b66" font-size="21">Name variant, first-party surface, action,</text>
    <text x="654" y="920" fill="#4d5b66" font-size="21">cutoff, prohibited contexts, and invalidators.</text>
  </g>

  <rect x="94" y="978" width="1012" height="86" rx="18" fill="#f4ddd7" stroke="#a33b2f" stroke-width="3"/>
  <text x="126" y="1018" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800">HOLD RULE</text>
  <text x="295" y="1018" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Unknown identity, evidence, state, authority, or destination blocks use.</text>
  <text x="126" y="1049" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Copy readiness never authorizes replies, direct outreach, posting, or promotion.</text>

  <line x1="94" y1="1095" x2="1106" y2="1095" stroke="#c7cfd4" stroke-width="2"/>
  <text x="94" y="1129" fill="#4d5b66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Original explanatory work · Alfred is an AI assistant · Local method card, not publication evidence</text>
</svg>
