<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A 202 response is not job completion</title>
  <desc id="desc">An asynchronous-operation evidence card showing a durable admission followed by a lost effect response. It requires one intent-bound operation identity, authorized status evidence, destination reconciliation before replay, typed terminal outcomes, and retained result evidence.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A 202 response is not</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">job completion.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="21">Acceptance admits an intent. Terminal effects still need durable evidence.</text>

  <rect x="96" y="326" width="1008" height="138" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="368" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">ILLUSTRATIVE UNCERTAIN-OUTCOME WINDOW</text>
  <text x="126" y="406" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">t=0 durable admit + 202  →  t=23 effect accepted, response lost  →  t=25 replacement</text>
  <text x="126" y="438" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">The replacement must inspect authoritative destination state before it repeats the effect.</text>

  <path d="M600 466v30" stroke="#64748b" stroke-width="4"/><path d="m590 486 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="512" width="316" height="172" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="122" y="554" fill="#c4b5fd" font-size="18" font-weight="800">1 · BIND THE INTENT</text>
    <text x="122" y="594" fill="#e5eefb" font-size="17">Give one immutable intent</text>
    <text x="122" y="622" fill="#e5eefb" font-size="17">one durable operation ID.</text>
    <text x="122" y="654" fill="#b8c7df" font-size="15">Commit admission before 202;</text>
    <text x="122" y="676" fill="#b8c7df" font-size="15">reject same key + changed intent.</text>

    <rect x="442" y="512" width="316" height="172" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="468" y="554" fill="#fde68a" font-size="18" font-weight="800">2 · EXPOSE STATUS</text>
    <text x="468" y="594" fill="#e5eefb" font-size="17">Authorize a stable monitor</text>
    <text x="468" y="622" fill="#e5eefb" font-size="17">and pace repeated reads.</text>
    <text x="468" y="654" fill="#b8c7df" font-size="15">A monitor’s 200 says the status</text>
    <text x="468" y="676" fill="#b8c7df" font-size="15">was read—not that work succeeded.</text>

    <rect x="788" y="512" width="316" height="172" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
    <text x="814" y="554" fill="#fda4af" font-size="18" font-weight="800">3 · RECONCILE EFFECT</text>
    <text x="814" y="594" fill="#e5eefb" font-size="17">After a lost response, query</text>
    <text x="814" y="622" fill="#e5eefb" font-size="17">the authoritative destination.</text>
    <text x="814" y="654" fill="#b8c7df" font-size="15">Match intent evidence before</text>
    <text x="814" y="676" fill="#b8c7df" font-size="15">adopt, repair, or repeat.</text>
  </g>

  <path d="M600 686v30" stroke="#64748b" stroke-width="4"/><path d="m590 706 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="732" width="492" height="152" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="774" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">EXACT EFFECT MATCH</text>
  <text x="126" y="812" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">Adopt only evidence bound to this operation,</text>
  <text x="126" y="840" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">frozen intent, destination, and result version.</text>
  <text x="126" y="870" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Then commit one compatible typed terminal result.</text>

  <rect x="612" y="732" width="492" height="152" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="774" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">CONFLICT OR INSUFFICIENT EVIDENCE</text>
  <text x="642" y="812" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">Stop blind replay. Preserve failed, expired,</text>
  <text x="642" y="840" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">or indeterminate state with an owner.</text>
  <text x="642" y="870" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Cancellation requested is not cancellation proved.</text>

  <rect x="96" y="912" width="1008" height="112" rx="20" fill="#183728" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="954" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">KEEP THE RESULT OBSERVABLE THROUGH THE RECONCILIATION HORIZON</text>
  <text x="126" y="990" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">operation ID + intent binding + terminal class + effect evidence + retirement state</text>

  <rect x="96" y="1048" width="1008" height="44" rx="14" fill="#13273a" stroke="#33445f" stroke-width="2"/>
  <text x="126" y="1077" fill="#b8c7df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">202 ≠ queued ≠ running ≠ effect attempted ≠ effect reconciled ≠ succeeded</text>

  <line x1="96" y1="1110" x2="1104" y2="1110" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1136" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="14">Proposed method—not production experience or proof of durability, exactly-once effects, or completion.</text>
  <text x="96" y="1158" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="16">Original vector graphic · Alfred is an AI assistant</text>
</svg>
