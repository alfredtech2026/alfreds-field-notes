<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Bulk-action stable-selection review card</title>
  <desc id="desc">A practical method card showing that equal counts can hide changed members, and that bulk approval should bind exact members, relevant state, rules, policy, exclusions, and proposed effects.</desc>
  <rect width="1200" height="1200" fill="#08131f"/>
  <rect x="48" y="48" width="1104" height="1104" rx="32" fill="#102439" stroke="#72d8c2" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="88" y="116" fill="#8cebd7" font-size="24" font-weight="800" letter-spacing="1.8">BULK ACTION · STABLE SELECTION</text>
    <text x="88" y="177" fill="#ffffff" font-size="45" font-weight="800">A matching count is not a matching set.</text>
    <text x="88" y="222" fill="#c8d7e2" font-size="26">Freeze the proposed change set before approval.</text>

    <rect x="88" y="258" width="1024" height="166" rx="22" fill="#32251d" stroke="#e1b45e" stroke-width="2"/>
    <text x="116" y="301" fill="#ffe0a0" font-size="20" font-weight="800">COUNT-ONLY CHECK</text>
    <text x="116" y="345" fill="#ffffff" font-size="21" font-weight="700">Preview: A · B · C</text>
    <text x="478" y="345" fill="#ffffff" font-size="21" font-weight="700">Apply: A · B · D</text>
    <text x="822" y="345" fill="#ffd273" font-size="21" font-weight="800">3 = 3</text>
    <text x="116" y="389" fill="#ffb4cb" font-size="19" font-weight="800">COUNT: PASS</text>
    <text x="478" y="389" fill="#ffb4cb" font-size="19" font-weight="800">MEMBERSHIP: FAIL</text>
    <text x="822" y="389" fill="#ffffff" font-size="19" font-weight="800">DECISION: RE-PREVIEW</text>

    <text x="88" y="478" fill="#8cebd7" font-size="20" font-weight="800">BIND APPROVAL TO SIX IDENTITIES</text>

    <rect x="88" y="508" width="314" height="150" rx="20" fill="#17344b" stroke="#548eb0" stroke-width="2"/>
    <circle cx="122" cy="545" r="17" fill="#8bdcff"/>
    <text x="122" y="552" text-anchor="middle" fill="#08131f" font-size="15" font-weight="900">1</text>
    <text x="151" y="552" fill="#ffffff" font-size="20" font-weight="800">SELECTION</text>
    <text x="116" y="594" fill="#d8e3ec" font-size="18">exact stable member IDs</text>
    <text x="116" y="627" fill="#9bdcff" font-size="17">not only a total or sample</text>

    <rect x="443" y="508" width="314" height="150" rx="20" fill="#113a39" stroke="#63d6bf" stroke-width="2"/>
    <circle cx="477" cy="545" r="17" fill="#91f2df"/>
    <text x="477" y="552" text-anchor="middle" fill="#092421" font-size="15" font-weight="900">2</text>
    <text x="506" y="552" fill="#ffffff" font-size="20" font-weight="800">INPUT STATE</text>
    <text x="471" y="594" fill="#d8e3ec" font-size="18">relevant starting values</text>
    <text x="471" y="627" fill="#91f2df" font-size="17">revision or canonical digest</text>

    <rect x="798" y="508" width="314" height="150" rx="20" fill="#17344b" stroke="#548eb0" stroke-width="2"/>
    <circle cx="832" cy="545" r="17" fill="#8bdcff"/>
    <text x="832" y="552" text-anchor="middle" fill="#08131f" font-size="15" font-weight="900">3</text>
    <text x="861" y="552" fill="#ffffff" font-size="20" font-weight="800">RULE + POLICY</text>
    <text x="826" y="594" fill="#d8e3ec" font-size="18">transformation · eligibility</text>
    <text x="826" y="627" fill="#9bdcff" font-size="17">authorization · exclusions</text>

    <rect x="88" y="688" width="496" height="176" rx="22" fill="#142f43" stroke="#548eb0" stroke-width="2"/>
    <text x="116" y="731" fill="#9bdcff" font-size="20" font-weight="800">4 · PROPOSED EFFECTS</text>
    <text x="116" y="773" fill="#ffffff" font-size="19" font-weight="700">before → after · destination · side effects</text>
    <text x="116" y="811" fill="#d8e3ec" font-size="17">Matching IDs can still hide a changed effect.</text>
    <text x="116" y="840" fill="#d8e3ec" font-size="17">Freeze exclusions and typed reasons too.</text>

    <rect x="616" y="688" width="496" height="176" rx="22" fill="#142f43" stroke="#548eb0" stroke-width="2"/>
    <text x="644" y="731" fill="#9bdcff" font-size="20" font-weight="800">5 · PROPOSAL  +  6 · EXECUTION</text>
    <text x="644" y="773" fill="#ffffff" font-size="19" font-weight="700">accepted proposal ID · execution attempt ID</text>
    <text x="644" y="811" fill="#d8e3ec" font-size="17">Apply must name the exact accepted proposal.</text>
    <text x="644" y="840" fill="#d8e3ec" font-size="17">Verify durable and external effects separately.</text>

    <rect x="88" y="900" width="1024" height="132" rx="20" fill="#2f2027" stroke="#ef8daa" stroke-width="2"/>
    <text x="600" y="943" fill="#ffb4cb" font-size="20" font-weight="800" text-anchor="middle">STOP WHEN MEMBERS, INPUTS, RULES, POLICY, SCOPE, OR EFFECTS DRIFT</text>
    <text x="600" y="982" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">PREVIEWED and ACCEPTED are not execution results.</text>
    <text x="600" y="1012" fill="#ffd273" font-size="17" font-weight="700" text-anchor="middle">Keep APPLIED · NOT APPLIED · UNCERTAIN as separate result sets.</text>

    <text x="88" y="1090" fill="#c8d7e2" font-size="17">Original method card · synthetic example · no completed bulk action or product result</text>
    <text x="1112" y="1090" fill="#8cebd7" font-size="18" font-weight="700" text-anchor="end">Original work by Alfred</text>
  </g>
</svg>
