<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A timeout is not proof that work stopped</title>
  <desc id="desc">A timeout and cancellation evidence card showing an illustrative caller deadline after an effect commits but before its response arrives. It separates waiting, cancellation delivery and observation, worker termination, effect reconciliation, and retry authority.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A timeout is not proof that</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">work stopped.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="21">One wait ended. Execution, effects, and replay safety still need evidence.</text>

  <rect x="96" y="326" width="1008" height="142" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="368" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">ILLUSTRATIVE LOST-RESPONSE WINDOW</text>
  <text x="126" y="406" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">t=4.8 effect commits  →  t=5 caller deadline  →  cancellation sent  →  response absent</text>
  <text x="126" y="440" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">The timeout cannot erase the committed effect or prove that the worker observed cancellation.</text>

  <path d="M600 470v28" stroke="#64748b" stroke-width="4"/><path d="m590 488 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="514" width="316" height="178" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="122" y="556" fill="#c4b5fd" font-size="18" font-weight="800">1 · CLASSIFY THE WAIT</text>
    <text x="122" y="596" fill="#e5eefb" font-size="17">Name observer, phase, clock,</text>
    <text x="122" y="624" fill="#e5eefb" font-size="17">and the budget that expired.</text>
    <text x="122" y="658" fill="#b8c7df" font-size="15">Receipt, admission, execution,</text>
    <text x="122" y="680" fill="#b8c7df" font-size="15">and effect state remain separate.</text>

    <rect x="442" y="514" width="316" height="178" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="468" y="556" fill="#fde68a" font-size="18" font-weight="800">2 · TRACE CANCELLATION</text>
    <text x="468" y="596" fill="#e5eefb" font-size="17">Record request, delivery,</text>
    <text x="468" y="624" fill="#e5eefb" font-size="17">observation, fence, and stop.</text>
    <text x="468" y="658" fill="#b8c7df" font-size="15">Cooperative cancellation is not</text>
    <text x="468" y="680" fill="#b8c7df" font-size="15">preemptive worker termination.</text>

    <rect x="788" y="514" width="316" height="178" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
    <text x="814" y="556" fill="#fda4af" font-size="18" font-weight="800">3 · RECONCILE EFFECT</text>
    <text x="814" y="596" fill="#e5eefb" font-size="17">Query the authoritative</text>
    <text x="814" y="624" fill="#e5eefb" font-size="17">destination before repeating.</text>
    <text x="814" y="658" fill="#b8c7df" font-size="15">Use the same operation identity</text>
    <text x="814" y="680" fill="#b8c7df" font-size="15">and immutable intent binding.</text>
  </g>

  <path d="M600 694v28" stroke="#64748b" stroke-width="4"/><path d="m590 712 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="738" width="492" height="150" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="780" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">EXACT MATCH OR SAFE ABSENCE</text>
  <text x="126" y="818" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">Adopt the intent-bound committed effect—or</text>
  <text x="126" y="846" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">replace only after authoritative safe absence.</text>
  <text x="126" y="876" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Fence every stale attempt before new effects.</text>

  <rect x="612" y="738" width="492" height="150" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="780" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">UNKNOWN, CONFLICTING, OR UNQUERYABLE</text>
  <text x="642" y="818" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">Keep the outcome reconciling or indeterminate.</text>
  <text x="642" y="846" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">Do not turn missing evidence into retry permission.</text>
  <text x="642" y="876" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Compensation is a separately authorized effect.</text>

  <rect x="96" y="916" width="1008" height="108" rx="20" fill="#183728" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="958" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">RETAIN EVIDENCE THROUGH THE DUPLICATE-RISK HORIZON</text>
  <text x="126" y="994" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">operation + intent + attempt generation + cancellation transitions + effect + terminal class</text>

  <rect x="96" y="1048" width="1008" height="44" rx="14" fill="#13273a" stroke="#33445f" stroke-width="2"/>
  <text x="126" y="1077" fill="#b8c7df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">timed out ≠ canceled ≠ worker stopped ≠ rolled back ≠ safe to retry</text>

  <line x1="96" y1="1110" x2="1104" y2="1110" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1136" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="14">Proposed method—not production experience or proof of cancellation, rollback, effect absence, or safe retry.</text>
  <text x="96" y="1158" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="16">Original vector graphic · Original work by Alfred</text>
</svg>
