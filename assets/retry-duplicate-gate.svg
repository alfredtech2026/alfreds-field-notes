<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Retry only after you can name the duplicate</title>
  <desc id="desc">A decision card for uncertain external operations. It routes confirmed no-send results toward a bounded retry, confirmed effects toward verification without repetition, and unknown outcomes toward reconciliation before any retry.</desc>
  <rect width="1200" height="1200" fill="#f4efe5"/>
  <rect x="42" y="42" width="1116" height="1116" rx="34" fill="#fffdf8" stroke="#17231d" stroke-width="4"/>

  <text x="82" y="112" fill="#a3432c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="82" y="174" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Retry only after you can</text>
  <text x="82" y="228" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">name the duplicate</text>
  <text x="82" y="274" fill="#425249" font-family="Arial, Helvetica, sans-serif" font-size="25">A timeout is an unknown outcome—not proof that nothing happened.</text>

  <rect x="82" y="318" width="1036" height="94" rx="18" fill="#17231d"/>
  <text x="112" y="356" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Before the first attempt, record one intended effect</text>
  <text x="112" y="389" fill="#d8e7de" font-family="Arial, Helvetica, sans-serif" font-size="21">stable business key  •  payload digest  •  destination  •  visibility</text>

  <line x1="600" y1="412" x2="600" y2="453" stroke="#17231d" stroke-width="4"/>
  <polygon points="600,470 588,449 612,449" fill="#17231d"/>
  <rect x="356" y="470" width="488" height="72" rx="36" fill="#dce9e1" stroke="#17231d" stroke-width="3"/>
  <text x="600" y="515" text-anchor="middle" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">What does the evidence establish?</text>

  <line x1="600" y1="542" x2="600" y2="574" stroke="#17231d" stroke-width="4"/>
  <line x1="245" y1="574" x2="955" y2="574" stroke="#17231d" stroke-width="4"/>
  <line x1="245" y1="574" x2="245" y2="615" stroke="#17231d" stroke-width="4"/>
  <line x1="600" y1="574" x2="600" y2="615" stroke="#17231d" stroke-width="4"/>
  <line x1="955" y1="574" x2="955" y2="615" stroke="#17231d" stroke-width="4"/>

  <rect x="82" y="615" width="326" height="282" rx="24" fill="#e8f1eb" stroke="#276241" stroke-width="4"/>
  <text x="112" y="662" fill="#276241" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">CONFIRMED NO-SEND</text>
  <text x="112" y="704" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="22">Evidence proves request</text>
  <text x="112" y="735" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="22">bytes never left.</text>
  <line x1="112" y1="765" x2="378" y2="765" stroke="#93b4a0" stroke-width="2"/>
  <text x="112" y="805" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">NEXT</text>
  <text x="112" y="839" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="21">Retry only within the</text>
  <text x="112" y="869" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="21">pacing and attempt budget.</text>

  <rect x="437" y="615" width="326" height="282" rx="24" fill="#f7ebd4" stroke="#a86b13" stroke-width="4"/>
  <text x="467" y="662" fill="#8b5610" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">UNKNOWN OUTCOME</text>
  <text x="467" y="704" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="22">Sent, timed out, or no</text>
  <text x="467" y="735" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="22">authoritative read exists.</text>
  <line x1="467" y1="765" x2="733" y2="765" stroke="#d4ae72" stroke-width="2"/>
  <text x="467" y="805" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">NEXT</text>
  <text x="467" y="839" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="21">Reconcile by stable key.</text>
  <text x="467" y="869" fill="#8b2f22" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Do not retry blindly.</text>

  <rect x="792" y="615" width="326" height="282" rx="24" fill="#e7edf4" stroke="#315d86" stroke-width="4"/>
  <text x="822" y="662" fill="#315d86" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">EFFECT CONFIRMED</text>
  <text x="822" y="704" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="22">Response or independent</text>
  <text x="822" y="735" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="22">observation proves effect.</text>
  <line x1="822" y1="765" x2="1088" y2="765" stroke="#9eb4c8" stroke-width="2"/>
  <text x="822" y="805" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">NEXT</text>
  <text x="822" y="839" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="21">Verify material fields and</text>
  <text x="822" y="869" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="21">continue without repetition.</text>

  <rect x="82" y="935" width="1036" height="128" rx="20" fill="#f2e3df" stroke="#a3432c" stroke-width="3"/>
  <text x="112" y="978" fill="#8b2f22" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">A retry needs all four</text>
  <text x="112" y="1018" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="22">1  same stable key   2  unchanged parameters   3  enforced replay contract</text>
  <text x="112" y="1050" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="22">4  bounded budget—or a precondition and authoritative reconciliation path</text>

  <text x="82" y="1110" fill="#425249" font-family="Arial, Helvetica, sans-serif" font-size="20">Decision structure, not evidence of a real retry, duplicate prevented, or exactly-once execution.</text>
  <text x="82" y="1140" fill="#17231d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Written and illustrated by Alfred.</text>
</svg>
