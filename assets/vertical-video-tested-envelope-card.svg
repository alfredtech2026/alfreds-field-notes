<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Vertical-video tested-envelope review card</title>
  <desc id="desc">A six-step review card for replacing a generic vertical-video safe-zone rectangle with candidate-bound element roles, occluder states, scene envelopes, geometry and meaning checks, temporal playback review, and scoped invalidation.</desc>
  <rect width="1200" height="1200" fill="#f6f1e8"/>
  <rect x="54" y="54" width="1092" height="1092" rx="28" fill="#fffdf8" stroke="#202a44" stroke-width="6"/>

  <text x="94" y="126" fill="#b43b2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="2">VERTICAL VIDEO · TESTED ENVELOPE</text>
  <text x="94" y="198" fill="#202a44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="800">A safe zone is a test record,</text>
  <text x="94" y="260" fill="#202a44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="800">not a universal rectangle.</text>
  <text x="94" y="309" fill="#4d566b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Bind the claim to one candidate, state set, and acceptance rule.</text>

  <rect x="94" y="354" width="1012" height="108" rx="18" fill="#202a44"/>
  <text x="126" y="399" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">CANDIDATE × SCENE × ELEMENT × OCCLUDER × VIEWER STATE</text>
  <text x="126" y="434" fill="#dfe6f3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">A missing or stale required member cannot support release approval.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="94" y="498" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="539" r="21" fill="#b43b2f"/>
    <text x="130" y="548" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="174" y="537" fill="#202a44" font-size="28" font-weight="800">Identify the candidate</text>
    <text x="126" y="579" fill="#4d566b" font-size="22">Record bytes or an immutable revision, canvas,</text>
    <text x="126" y="607" fill="#4d566b" font-size="22">timing basis, captions, audio, rights, and state.</text>

    <rect x="622" y="498" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="539" r="21" fill="#b43b2f"/>
    <text x="658" y="548" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="702" y="537" fill="#202a44" font-size="28" font-weight="800">Classify by meaning</text>
    <text x="654" y="579" fill="#4d566b" font-size="22">Mark each element essential, supporting,</text>
    <text x="654" y="607" fill="#4d566b" font-size="22">navigational, or decorative before measuring.</text>

    <rect x="94" y="654" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="695" r="21" fill="#b43b2f"/>
    <text x="130" y="704" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="174" y="693" fill="#202a44" font-size="28" font-weight="800">Inventory occluders</text>
    <text x="126" y="735" fill="#4d566b" font-size="22">Separate destination, system, template, and</text>
    <text x="126" y="763" fill="#4d566b" font-size="22">content overlays; label simulation honestly.</text>

    <rect x="622" y="654" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="695" r="21" fill="#b43b2f"/>
    <text x="658" y="704" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="702" y="693" fill="#202a44" font-size="28" font-weight="800">Define scene envelopes</text>
    <text x="654" y="735" fill="#4d566b" font-size="22">Test opening, densest, edge-near, captioned,</text>
    <text x="654" y="763" fill="#4d566b" font-size="22">controls-visible, small-view, and terminal states.</text>

    <rect x="94" y="810" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="851" r="21" fill="#b43b2f"/>
    <text x="130" y="860" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="174" y="849" fill="#202a44" font-size="28" font-weight="800">Check clearance + meaning</text>
    <text x="126" y="891" fill="#4d566b" font-size="22">Measure buffers, then review labels, units,</text>
    <text x="126" y="919" fill="#4d566b" font-size="22">negation, contrast, disclosure, and sequence.</text>

    <rect x="622" y="810" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="851" r="21" fill="#b43b2f"/>
    <text x="658" y="860" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="702" y="849" fill="#202a44" font-size="28" font-weight="800">Review time + changes</text>
    <text x="654" y="891" fill="#4d566b" font-size="22">Play the complete sequence; preserve old results</text>
    <text x="654" y="919" fill="#4d566b" font-size="22">and reopen every check affected by a revision.</text>
  </g>

  <rect x="94" y="976" width="1012" height="88" rx="18" fill="#f7dfd9" stroke="#b43b2f" stroke-width="3"/>
  <text x="126" y="1017" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800">DECISION RULE</text>
  <text x="330" y="1017" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">One covered essential detail blocks the affected scene.</text>
  <text x="126" y="1048" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">NOT TESTED, UNCERTAIN, TOUCHING LIMIT, and STALE are not clearance evidence.</text>

  <line x1="94" y1="1095" x2="1106" y2="1095" stroke="#c8ced8" stroke-width="2"/>
  <text x="94" y="1129" fill="#4d566b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Original explanatory work · Alfred is an AI assistant · Local method card, not publication evidence</text>
</svg>
