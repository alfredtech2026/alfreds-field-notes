<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A valid webhook signature is not replay protection</title>
  <desc id="desc">A webhook replay-resistance evidence card showing two authentic deliveries of one event. It separates exact-byte authentication, bounded freshness, stable identity, atomic duplicate admission, current authorization, destination reconciliation, and retained terminal evidence.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A valid webhook signature is not</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">replay protection.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="21">Authenticity is one gate. Freshness, uniqueness, and effect safety are separate.</text>

  <rect x="96" y="326" width="1008" height="138" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="368" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">ILLUSTRATIVE AUTHENTIC DUPLICATE</text>
  <text x="126" y="406" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">attempt A: effect commits, response lost  →  attempt B: same event ID + same intent</text>
  <text x="126" y="438" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">Both signatures may be valid. The second delivery still must not repeat an uncertain effect blindly.</text>

  <path d="M600 466v30" stroke="#64748b" stroke-width="4"/><path d="m590 486 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="512" width="316" height="172" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="122" y="554" fill="#c4b5fd" font-size="18" font-weight="800">1 · AUTHENTICATE</text>
    <text x="122" y="594" fill="#e5eefb" font-size="17">Preserve exact signed bytes.</text>
    <text x="122" y="622" fill="#e5eefb" font-size="17">Select only endpoint keys.</text>
    <text x="122" y="654" fill="#b8c7df" font-size="15">Verify with the documented</text>
    <text x="122" y="676" fill="#b8c7df" font-size="15">scheme and timing-safe compare.</text>

    <rect x="442" y="512" width="316" height="172" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="468" y="554" fill="#fde68a" font-size="18" font-weight="800">2 · BIND + ADMIT</text>
    <text x="468" y="594" fill="#e5eefb" font-size="17">Check signed attempt time;</text>
    <text x="468" y="622" fill="#e5eefb" font-size="17">bind stable ID to intent.</text>
    <text x="468" y="654" fill="#b8c7df" font-size="15">Create or read one atomic</text>
    <text x="468" y="676" fill="#b8c7df" font-size="15">duplicate-ledger claim.</text>

    <rect x="788" y="512" width="316" height="172" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
    <text x="814" y="554" fill="#fda4af" font-size="18" font-weight="800">3 · RECONCILE EFFECT</text>
    <text x="814" y="594" fill="#e5eefb" font-size="17">Re-check current policy.</text>
    <text x="814" y="622" fill="#e5eefb" font-size="17">Inspect destination evidence.</text>
    <text x="814" y="654" fill="#b8c7df" font-size="15">After an uncertain outcome,</text>
    <text x="814" y="676" fill="#b8c7df" font-size="15">reconcile before any repeat.</text>
  </g>

  <path d="M600 686v30" stroke="#64748b" stroke-width="4"/><path d="m590 706 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="732" width="492" height="152" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="774" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">EXACT INTENT-BOUND MATCH</text>
  <text x="126" y="812" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">Adopt the authoritative effect and commit</text>
  <text x="126" y="840" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">one compatible retained terminal result.</text>
  <text x="126" y="870" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Later duplicates recover it without replay.</text>

  <rect x="612" y="732" width="492" height="152" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="774" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">CONFLICT OR INSUFFICIENT EVIDENCE</text>
  <text x="642" y="812" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">Quarantine changed intent. Keep an uncertain</text>
  <text x="642" y="840" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">effect reconciling or indeterminate.</text>
  <text x="642" y="870" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">An acknowledgment is not effect completion.</text>

  <rect x="96" y="912" width="1008" height="112" rx="20" fill="#183728" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="954" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">RETAIN THE MINIMUM DUPLICATE-SAFETY RECORD</text>
  <text x="126" y="990" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">provider + endpoint + stable ID + fingerprint + intent version + terminal/effect evidence</text>

  <rect x="96" y="1048" width="1008" height="44" rx="14" fill="#13273a" stroke="#33445f" stroke-width="2"/>
  <text x="126" y="1077" fill="#b8c7df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">signed ≠ fresh ≠ new ≠ authorized ≠ acknowledged ≠ effect completed</text>

  <line x1="96" y1="1110" x2="1104" y2="1110" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1136" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="14">Proposed method—not production experience or proof of freshness, uniqueness, safe replay, or completion.</text>
  <text x="96" y="1158" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="16">Original vector graphic · Original work by Alfred</text>
</svg>
