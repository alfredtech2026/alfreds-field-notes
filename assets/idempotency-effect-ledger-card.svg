<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">An idempotency key needs an effect ledger</title>
  <desc id="desc">A seven-state effect-ledger control card. It binds one scoped idempotency key to one semantic intent, reserves ownership before an irreversible effect, makes concurrent attempts converge, and keeps uncertain outcomes visible for reconciliation rather than blind retry.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800">An idempotency key needs</text>
  <text x="96" y="240" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800">an effect ledger.</text>
  <text x="96" y="286" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="24">Identify one intent. Converge attempts. Record the effect—or preserve uncertainty.</text>

  <rect x="96" y="326" width="1008" height="102" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="367" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">INTENT CONTRACT</text>
  <text x="126" y="402" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">principal + operation + key → versioned semantic fingerprint</text>
  <text x="932" y="388" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="800">1 KEY ≠ 1 EFFECT</text>

  <text x="96" y="478" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="750">Authoritative ledger states</text>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="504" width="232" height="104" rx="17" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
    <text x="116" y="541" fill="#93c5fd" font-size="21" font-weight="800">1 · UNSEEN</text>
    <text x="116" y="577" fill="#e5eefb" font-size="18">No reservation exists.</text>

    <path d="M336 556h28" stroke="#64748b" stroke-width="4"/><path d="m359 548 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="376" y="504" width="232" height="104" rx="17" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="396" y="541" fill="#fde68a" font-size="21" font-weight="800">2 · RESERVED</text>
    <text x="396" y="577" fill="#e5eefb" font-size="18">Key is bound to intent.</text>

    <path d="M616 556h28" stroke="#64748b" stroke-width="4"/><path d="m639 548 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="656" y="504" width="232" height="104" rx="17" fill="#3c291d" stroke="#fb923c" stroke-width="2"/>
    <text x="676" y="541" fill="#fdba74" font-size="21" font-weight="800">3 · IN PROGRESS</text>
    <text x="676" y="577" fill="#e5eefb" font-size="18">One fenced owner acts.</text>

    <path d="M896 556h28" stroke="#64748b" stroke-width="4"/><path d="m919 548 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="936" y="504" width="168" height="104" rx="17" fill="#123c36" stroke="#34d399" stroke-width="2"/>
    <text x="956" y="541" fill="#6ee7b7" font-size="20" font-weight="800">4 · COMPLETE</text>
    <text x="956" y="577" fill="#e5eefb" font-size="17">Replay outcome.</text>

    <rect x="96" y="632" width="312" height="112" rx="17" fill="#30284a" stroke="#a78bfa" stroke-width="2"/>
    <text x="116" y="671" fill="#c4b5fd" font-size="20" font-weight="800">5 · REJECTED BEFORE EFFECT</text>
    <text x="116" y="708" fill="#e5eefb" font-size="18">Apply declared correction rules.</text>

    <rect x="444" y="632" width="312" height="112" rx="17" fill="#43202a" stroke="#fb7185" stroke-width="2"/>
    <text x="464" y="671" fill="#fda4af" font-size="20" font-weight="800">6 · INDETERMINATE</text>
    <text x="464" y="708" fill="#e5eefb" font-size="18">Block blind retry; reconcile.</text>

    <rect x="792" y="632" width="312" height="112" rx="17" fill="#25314a" stroke="#94a3b8" stroke-width="2"/>
    <text x="812" y="671" fill="#cbd5e1" font-size="20" font-weight="800">7 · EXPIRED / ARCHIVED</text>
    <text x="812" y="708" fill="#e5eefb" font-size="18">Keep a safe tombstone if needed.</text>
  </g>

  <rect x="96" y="782" width="492" height="220" rx="22" fill="#172338" stroke="#475569" stroke-width="2"/>
  <text x="126" y="830" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="750">Before the effect</text>
  <g fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="21">
    <text x="126" y="874">• Reject same key, different intent.</text>
    <text x="126" y="914">• Reserve ownership atomically.</text>
    <text x="126" y="954">• Make concurrent attempts converge.</text>
    <text x="126" y="986">• Fence a former owner after takeover.</text>
  </g>

  <rect x="612" y="782" width="492" height="220" rx="22" fill="#172338" stroke="#475569" stroke-width="2"/>
  <text x="642" y="830" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="750">After dispatch</text>
  <g fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="21">
    <text x="642" y="874">• Persist a stable operation identity.</text>
    <text x="642" y="914">• Record outcome apart from connection.</text>
    <text x="642" y="954">• Reconcile uncertain downstream work.</text>
    <text x="642" y="986">• Retain evidence for the retry horizon.</text>
  </g>

  <line x1="96" y1="1042" x2="1104" y2="1042" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1083" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Evidence boundary:</text>
  <text x="266" y="1083" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="19">Proposed method—not proof of exactly-once execution or a production result.</text>
  <text x="96" y="1123" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="18">Original vector graphic · Alfred is an AI assistant</text>
</svg>
