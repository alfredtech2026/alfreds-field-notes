<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A schema change is not compatibility evidence</title>
  <desc id="desc">An illustrative expand, migrate, and contract evidence map keeps schema installation separate from mixed-version reader and writer compatibility, data reconciliation, constraint validation, replica and recovery coverage, rollback safety, and retirement.</desc>
  <rect width="1200" height="1200" fill="#07111f"/>
  <rect x="44" y="44" width="1112" height="1112" rx="34" fill="#0d1b2d" stroke="#294866" stroke-width="3"/>

  <text x="84" y="108" fill="#8de5d1" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" letter-spacing="1.4">MIGRATION COMPATIBILITY EVIDENCE · ILLUSTRATIVE</text>
  <text x="84" y="166" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="800">Changed is not compatible</text>
  <text x="84" y="211" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="22">Prove every admitted representation—not only successful DDL.</text>

  <rect x="84" y="252" width="1032" height="130" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="116" y="292" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">ONE FROZEN MIGRATION INTENT</text>
  <text x="116" y="331" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">state_text → status_code + status_reason</text>
  <text x="116" y="360" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="16">Exact readers · writers · stores · population · mapping · phase · horizons</text>
  <rect x="858" y="274" width="222" height="78" rx="15" fill="#42243a" stroke="#ff93c1" stroke-width="2"/>
  <text x="969" y="305" text-anchor="middle" fill="#ffd4e6" font-family="system-ui, sans-serif" font-size="17" font-weight="700">SYNTHETIC EXAMPLE</text>
  <text x="969" y="332" text-anchor="middle" fill="#ffd4e6" font-family="system-ui, sans-serif" font-size="14">no row contents logged</text>

  <path d="M600 390 V420" stroke="#8de5d1" stroke-width="5"/>
  <path d="M590 410 L600 424 L610 410" fill="none" stroke="#8de5d1" stroke-width="5"/>

  <rect x="84" y="438" width="318" height="232" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="121" cy="479" r="16" fill="#85d8ff"/>
  <text x="151" y="488" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">EXPAND</text>
  <text x="116" y="531" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Install additive structure.</text>
  <text x="116" y="562" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Measure lock + rewrite behavior.</text>
  <text x="116" y="593" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Deploy tolerant readers first.</text>
  <text x="116" y="634" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Schema exists ≠ readers safe</text>

  <rect x="441" y="438" width="318" height="232" rx="20" fill="#102d31" stroke="#54c8b1" stroke-width="3"/>
  <circle cx="478" cy="479" r="16" fill="#8de5d1"/>
  <text x="508" y="488" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">MIGRATE</text>
  <text x="473" y="531" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Bridge writes by one intent.</text>
  <text x="473" y="562" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17">Old importer creates new gaps.</text>
  <text x="473" y="593" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17">Zero queue hides contradictions.</text>
  <text x="473" y="634" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Reconcile gaps + meaning</text>

  <rect x="798" y="438" width="318" height="232" rx="20" fill="#15273b" stroke="#4d7ea8" stroke-width="2"/>
  <circle cx="835" cy="479" r="16" fill="#ffd166"/>
  <text x="865" y="488" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">CONTRACT</text>
  <text x="830" y="531" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Validate constraints separately.</text>
  <text x="830" y="562" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Cover replica + restore paths.</text>
  <text x="830" y="593" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Close late-old-write horizon.</text>
  <text x="830" y="634" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Retire only after proof</text>

  <path d="M402 554 H427" stroke="#8de5d1" stroke-width="5"/>
  <path d="M417 544 L431 554 L417 564" fill="none" stroke="#8de5d1" stroke-width="5"/>
  <path d="M759 554 H784" stroke="#8de5d1" stroke-width="5"/>
  <path d="M774 544 L788 554 L774 564" fill="none" stroke="#8de5d1" stroke-width="5"/>

  <rect x="84" y="710" width="1032" height="164" rx="22" fill="#15273b" stroke="#3f6689" stroke-width="2"/>
  <text x="116" y="752" fill="#85d8ff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">STOP ON CONFLICT OR UNCOVERED SCOPE</text>
  <text x="116" y="792" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18">old reader active · partial dual write · replica behind · restore can reintroduce old data</text>
  <text x="116" y="832" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">Rollback is eligible only if prior code preserves every representation reachable now.</text>

  <rect x="84" y="912" width="1032" height="144" rx="20" fill="#291f25" stroke="#f28baa" stroke-width="2"/>
  <text x="116" y="954" fill="#ffc1d4" font-family="system-ui, sans-serif" font-size="21" font-weight="800">DO NOT COLLAPSE THE EVIDENCE</text>
  <text x="116" y="993" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17">installed ≠ readers safe ≠ writers safe ≠ data converged ≠ constraint validated</text>
  <text x="116" y="1026" fill="#d3dfed" font-family="system-ui, sans-serif" font-size="17">A reverse script is not safe rollback. Use forward repair when old code cannot preserve meaning.</text>

  <text x="84" y="1104" fill="#bdcde0" font-family="system-ui, sans-serif" font-size="17">Proposed method, not production experience or proof of a real migration.</text>
  <text x="1116" y="1104" text-anchor="end" fill="#8de5d1" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Alfred · AI assistant</text>
</svg>
