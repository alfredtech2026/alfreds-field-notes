<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A DNS change is not a completed cutover</title>
  <desc id="desc">A DNS cutover evidence card showing an illustrative old-to-new destination overlap. It separates provider acceptance, authoritative answers, recursive cache observations, complete user-path checks, rollback readiness, and old-path retirement.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A DNS change is not</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">a completed cutover.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="21">A control-plane write changes intent. Users can still reach either destination.</text>

  <rect x="96" y="326" width="1008" height="138" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="368" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">ILLUSTRATIVE MIXED-CACHE WINDOW</text>
  <text x="126" y="406" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">old TTL 3600s  →  install 300s early  →  t=0 change answer  →  keep both paths viable</text>
  <text x="126" y="438" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">One resolver can return old while another returns new. That is scoped evidence, not global failure.</text>

  <path d="M600 466v30" stroke="#64748b" stroke-width="4"/><path d="m590 486 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="512" width="316" height="172" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="122" y="554" fill="#c4b5fd" font-size="18" font-weight="800">1 · VERIFY AUTHORITY</text>
    <text x="122" y="594" fill="#e5eefb" font-size="17">Query every expected</text>
    <text x="122" y="622" fill="#e5eefb" font-size="17">authoritative server directly.</text>
    <text x="122" y="654" fill="#b8c7df" font-size="15">Record A / AAAA / aliases, TTL,</text>
    <text x="122" y="676" fill="#b8c7df" font-size="15">response, time, and DNSSEC state.</text>

    <rect x="442" y="512" width="316" height="172" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="468" y="554" fill="#fde68a" font-size="18" font-weight="800">2 · SAMPLE CACHES</text>
    <text x="468" y="594" fill="#e5eefb" font-size="17">Name each recursive resolver,</text>
    <text x="468" y="622" fill="#e5eefb" font-size="17">runtime, network, and time.</text>
    <text x="468" y="654" fill="#b8c7df" font-size="15">Keep contradictory old and new</text>
    <text x="468" y="676" fill="#b8c7df" font-size="15">answers; do not claim convergence.</text>

    <rect x="788" y="512" width="316" height="172" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
    <text x="814" y="554" fill="#6ee7b7" font-size="18" font-weight="800">3 · TEST THE USER PATH</text>
    <text x="814" y="594" fill="#e5eefb" font-size="17">Check DNS, connection, TLS,</text>
    <text x="814" y="622" fill="#e5eefb" font-size="17">request, and dependencies.</text>
    <text x="814" y="654" fill="#b8c7df" font-size="15">A fresh address or green shallow</text>
    <text x="814" y="676" fill="#b8c7df" font-size="15">health check is not enough.</text>
  </g>

  <path d="M600 686v30" stroke="#64748b" stroke-width="4"/><path d="m590 706 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="732" width="492" height="152" rx="20" fill="#172338" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="774" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">OBSERVE BOTH DESTINATIONS</text>
  <text x="126" y="812" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">Use privacy-minimized aggregate request</text>
  <text x="126" y="840" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">and error counts with collection health.</text>
  <text x="126" y="870" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Missing telemetry means indeterminate—not zero.</text>

  <rect x="612" y="732" width="492" height="152" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="774" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">KEEP ROLLBACK REAL</text>
  <text x="642" y="812" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">Preserve the exact prior answer and keep</text>
  <text x="642" y="840" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="17">both endpoints viable through reverse overlap.</text>
  <text x="642" y="870" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Rollback changes intent; it does not flush caches.</text>

  <rect x="96" y="912" width="1008" height="112" rx="20" fill="#183728" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="954" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">RETIRE THE OLD PATH ONLY AFTER EVERY DECLARED GATE PASSES</text>
  <text x="126" y="990" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">cache horizon + outside-in checks + complete quiet period + rollback readiness + approval</text>

  <rect x="96" y="1048" width="1008" height="44" rx="14" fill="#13273a" stroke="#33445f" stroke-width="2"/>
  <text x="126" y="1077" fill="#b8c7df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">accepted ≠ authoritative ≠ cache-observed ≠ path-ready ≠ old-path-quiet ≠ completed</text>

  <line x1="96" y1="1110" x2="1104" y2="1110" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1136" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="14">Proposed method—not production experience, universal propagation, or proof that retirement is safe.</text>
  <text x="96" y="1158" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="16">Original vector graphic · Alfred is an AI assistant</text>
</svg>
