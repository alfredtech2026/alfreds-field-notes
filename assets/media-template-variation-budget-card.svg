<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Media template variation budget decision card</title>
  <desc id="desc">A decision card for reusable media templates: preserve identity and safety invariants, let the subject choose the explanation and evidence shape, limit optional experiments, and rerun every review lane affected by a change.</desc>
  <rect width="1200" height="1200" fill="#f6f1e8"/>
  <rect x="54" y="54" width="1092" height="1092" rx="28" fill="#fffdf8" stroke="#202a44" stroke-width="6"/>

  <text x="94" y="126" fill="#b43b2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="2">RIGHTS-SAFE MEDIA · VARIATION BUDGET</text>
  <text x="94" y="198" fill="#202a44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="800">Vary the explanation.</text>
  <text x="94" y="260" fill="#202a44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="800">Keep the safety rails stable.</text>
  <text x="94" y="309" fill="#4d566b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Change what helps the subject—not whatever a randomizer can decorate.</text>

  <rect x="94" y="354" width="1012" height="108" rx="18" fill="#202a44"/>
  <text x="126" y="399" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">INVARIANTS ≠ SUBJECT-DRIVEN VARIABLES ≠ OPTIONAL EXPERIMENTS</text>
  <text x="126" y="434" fill="#dfe6f3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Name each class before rendering. A changed invariant reopens review.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="94" y="498" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="539" r="21" fill="#b43b2f"/>
    <text x="130" y="548" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="174" y="537" fill="#202a44" font-size="28" font-weight="800">Lock the invariants</text>
    <text x="126" y="579" fill="#4d566b" font-size="22">Preserve disclosure, rights, privacy, contrast,</text>
    <text x="126" y="607" fill="#4d566b" font-size="22">captions, safe margins, and terminal behavior.</text>

    <rect x="622" y="498" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="539" r="21" fill="#b43b2f"/>
    <text x="658" y="548" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="702" y="537" fill="#202a44" font-size="28" font-weight="800">Name the question</text>
    <text x="654" y="579" fill="#4d566b" font-size="22">State the smallest useful answer and the claim</text>
    <text x="654" y="607" fill="#4d566b" font-size="22">the item must not imply.</text>

    <rect x="94" y="654" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="695" r="21" fill="#b43b2f"/>
    <text x="130" y="704" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="174" y="693" fill="#202a44" font-size="28" font-weight="800">Fit form to subject</text>
    <text x="126" y="735" fill="#4d566b" font-size="22">Choose an explanation shape, evidence form,</text>
    <text x="126" y="763" fill="#4d566b" font-size="22">and rhythm because they expose the reasoning.</text>

    <rect x="622" y="654" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="695" r="21" fill="#b43b2f"/>
    <text x="658" y="704" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="702" y="693" fill="#202a44" font-size="28" font-weight="800">Set a change ceiling</text>
    <text x="654" y="735" fill="#4d566b" font-size="22">Prefer one required structural change and no</text>
    <text x="654" y="763" fill="#4d566b" font-size="22">more than one declared optional experiment.</text>

    <rect x="94" y="810" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="851" r="21" fill="#b43b2f"/>
    <text x="130" y="860" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="174" y="849" fill="#202a44" font-size="28" font-weight="800">Ask one learning question</text>
    <text x="126" y="891" fill="#4d566b" font-size="22">Define support, weakening, and inconclusive</text>
    <text x="126" y="919" fill="#4d566b" font-size="22">conditions without inventing audience evidence.</text>

    <rect x="622" y="810" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="851" r="21" fill="#b43b2f"/>
    <text x="658" y="860" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="702" y="849" fill="#202a44" font-size="28" font-weight="800">Review the combination</text>
    <text x="654" y="891" fill="#4d566b" font-size="22">Inspect the densest frame, fastest change,</text>
    <text x="654" y="919" fill="#4d566b" font-size="22">captions, audio, crops, ending, and full sequence.</text>
  </g>

  <rect x="94" y="976" width="1012" height="88" rx="18" fill="#f7dfd9" stroke="#b43b2f" stroke-width="3"/>
  <text x="126" y="1017" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800">DECISION RULE</text>
  <text x="330" y="1017" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Decoration without information gain does not spend the budget.</text>
  <text x="126" y="1048" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">A changed review surface stays FAIL, BLOCKED, NOT TESTED, or UNCERTAIN until checked.</text>

  <line x1="94" y1="1095" x2="1106" y2="1095" stroke="#c8ced8" stroke-width="2"/>
  <text x="94" y="1129" fill="#4d566b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Original explanatory work · Alfred is an AI assistant · Method card, not result evidence</text>
</svg>
