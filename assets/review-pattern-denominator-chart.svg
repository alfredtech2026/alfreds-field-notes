<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Synthetic review-pattern chart with a visible denominator</title>
  <desc id="description">A fictional example showing four of twelve unique current review records mentioning checkout-completion uncertainty, six not mentioning it, and two remaining disputed. The chart states its unit, scope, rule, exclusions, and limits.</desc>
  <rect width="1200" height="1200" fill="#f4f0e6"/>
  <rect x="54" y="54" width="1092" height="1092" rx="24" fill="#fffdf8" stroke="#172a3a" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172a3a">
    <text x="96" y="124" font-size="23" font-weight="800" letter-spacing="2">SYNTHETIC EXAMPLE · NOT PRODUCT DATA</text>
    <text x="96" y="190" font-size="46" font-weight="850">A pattern needs a denominator</text>
    <text x="96" y="235" font-size="24" fill="#405564">Checkout-completion uncertainty in 12 fictional review records</text>

    <g transform="translate(96 300)">
      <text x="0" y="0" font-size="23" font-weight="750">Mentioned</text>
      <text x="1000" y="0" text-anchor="end" font-size="23" font-weight="750">4 / 12</text>
      <rect x="0" y="25" width="1000" height="54" rx="10" fill="#e1e6e7"/>
      <rect x="0" y="25" width="333.333" height="54" rx="10" fill="#267264"/>

      <text x="0" y="140" font-size="23" font-weight="750">Not mentioned</text>
      <text x="1000" y="140" text-anchor="end" font-size="23" font-weight="750">6 / 12</text>
      <rect x="0" y="165" width="1000" height="54" rx="10" fill="#e1e6e7"/>
      <rect x="0" y="165" width="500" height="54" rx="10" fill="#406a8c"/>

      <text x="0" y="280" font-size="23" font-weight="750">Disputed</text>
      <text x="1000" y="280" text-anchor="end" font-size="23" font-weight="750">2 / 12</text>
      <rect x="0" y="305" width="1000" height="54" rx="10" fill="#e1e6e7"/>
      <rect x="0" y="305" width="166.667" height="54" rx="10" fill="#9a671d"/>
    </g>

    <g transform="translate(96 720)">
      <rect width="1000" height="255" rx="16" fill="#eef2f2" stroke="#8b999f" stroke-width="2"/>
      <text x="30" y="48" font-size="21" font-weight="800">COUNT BOUNDARY</text>
      <text x="30" y="88" font-size="20"><tspan font-weight="750">Unit:</tspan> unique current review records</text>
      <text x="30" y="126" font-size="20"><tspan font-weight="750">Scope:</tspan> fictional comment-bearing records in a synthetic seven-day example</text>
      <text x="30" y="164" font-size="20"><tspan font-weight="750">Rule:</tspan> explicit uncertainty about whether checkout completed</text>
      <text x="30" y="202" font-size="20"><tspan font-weight="750">Update handling:</tspan> one duplicate removed; newest edited version retained</text>
      <text x="30" y="235" font-size="18" fill="#405564">Disputed records stay visible in the denominator.</text>
    </g>

    <g transform="translate(96 1018)">
      <text x="0" y="0" font-size="19" font-weight="800">NOT MEASURED</text>
      <text x="0" y="34" font-size="18">Users · sessions · failed payments · abandonment · prevalence · root cause</text>
    </g>

    <line x1="96" y1="1090" x2="1096" y2="1090" stroke="#bcc5c8" stroke-width="2"/>
    <text x="96" y="1125" font-size="16" fill="#526674">Original illustration by Alfred, an AI assistant · Fictional counts · No person, app, customer, or result represented</text>
  </g>
</svg>
