<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A webhook endpoint is an admission controller</title>
  <desc id="desc">A control card showing that an authenticated webhook delivery should cross a durable admission boundary before a successful response. Downstream effect processing and authoritative effect evidence remain separate.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A webhook endpoint is an</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">admission controller.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="23">Make the response prove durable responsibility—not a completed business effect.</text>

  <text x="96" y="344" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="750">Narrow synchronous path</text>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="372" width="220" height="128" rx="18" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
    <text x="116" y="411" fill="#93c5fd" font-size="19" font-weight="800">1 · RECEIVE</text>
    <text x="116" y="446" fill="#e5eefb" font-size="18">Bound raw bytes.</text>
    <text x="116" y="474" fill="#b8c7df" font-size="16">Do not trust fields yet.</text>

    <path d="M324 436h24" stroke="#64748b" stroke-width="4"/><path d="m343 428 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="360" y="372" width="220" height="128" rx="18" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="380" y="411" fill="#c4b5fd" font-size="19" font-weight="800">2 · AUTHENTICATE</text>
    <text x="380" y="446" fill="#e5eefb" font-size="18">Verify exact bytes.</text>
    <text x="380" y="474" fill="#b8c7df" font-size="16">Bind key + endpoint.</text>

    <path d="M588 436h24" stroke="#64748b" stroke-width="4"/><path d="m607 428 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="624" y="372" width="220" height="128" rx="18" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="644" y="411" fill="#fde68a" font-size="19" font-weight="800">3 · CLASSIFY</text>
    <text x="644" y="446" fill="#e5eefb" font-size="18">Allowlist contract.</text>
    <text x="644" y="474" fill="#b8c7df" font-size="16">Scope ID + fingerprint.</text>

    <path d="M852 436h24" stroke="#64748b" stroke-width="4"/><path d="m871 428 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="888" y="372" width="216" height="128" rx="18" fill="#123c36" stroke="#34d399" stroke-width="2"/>
    <text x="908" y="411" fill="#6ee7b7" font-size="19" font-weight="800">4 · ADMIT</text>
    <text x="908" y="446" fill="#e5eefb" font-size="18">Commit durable record.</text>
    <text x="908" y="474" fill="#b8c7df" font-size="16">Uniqueness is atomic.</text>
  </g>

  <rect x="96" y="536" width="1008" height="112" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="578" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">SUCCESS RESPONSE GATE</text>
  <text x="126" y="620" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">authenticated + authorized + durable admission committed → respond</text>

  <rect x="96" y="684" width="492" height="242" rx="22" fill="#172338" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="732" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="750">Response-path evidence</text>
  <g fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="20">
    <text x="126" y="778">• Delivery identity is owned.</text>
    <text x="126" y="818">• Minimized work is durable.</text>
    <text x="126" y="858">• A duplicate can converge.</text>
    <text x="126" y="898">• The provider response was attempted.</text>
  </g>

  <rect x="612" y="684" width="492" height="242" rx="22" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="732" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="750">Not yet proved</text>
  <g fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="20">
    <text x="642" y="778">• Business effect completed.</text>
    <text x="642" y="818">• Delivery order is reliable.</text>
    <text x="642" y="858">• Effects occur exactly once.</text>
    <text x="642" y="898">• A lost effect response is safe to replay.</text>
  </g>

  <rect x="96" y="958" width="1008" height="76" rx="18" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
  <text x="126" y="990" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">UNKNOWN EFFECT?</text>
  <text x="322" y="990" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Reconcile authoritative state before replaying the business operation.</text>
  <text x="126" y="1018" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">Keep delivery admission, response outcome, worker reservation, and effect evidence distinct.</text>

  <line x1="96" y1="1062" x2="1104" y2="1062" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1098" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Evidence boundary:</text>
  <text x="256" y="1098" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="18">Proposed method—not proof of security or exactly-once effects.</text>
  <text x="96" y="1131" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="18">Original vector graphic · Original work by Alfred</text>
</svg>
