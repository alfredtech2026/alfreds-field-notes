<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A rate-limit response is not a retry schedule</title>
  <desc id="desc">A control card showing that a server wait hint establishes an earliest reconsideration boundary, while safe repetition, retry ownership, deadline, retry-load budget, and current capacity independently decide whether one later attempt may be admitted.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A rate-limit response is not</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">a retry schedule.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="23">A server hint can delay reconsideration. It cannot admit an attempt.</text>

  <rect x="96" y="326" width="1008" height="104" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="366" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">RATE-LIMIT EVIDENCE RECEIVED</text>
  <text x="126" y="400" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Preserve status, receipt time, policy scope, and the exact Retry-After form.</text>

  <path d="M600 432v38" stroke="#64748b" stroke-width="4"/><path d="m590 460 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="482" width="1008" height="112" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
  <text x="126" y="524" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">EARLIEST RECONSIDERATION</text>
  <text x="126" y="562" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">valid server hint + bounded local backoff + jitter → reconsider at or after T</text>

  <path d="M600 596v38" stroke="#64748b" stroke-width="4"/><path d="m590 624 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <text x="96" y="680" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="750">At T, re-evaluate every gate</text>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="704" width="316" height="152" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="122" y="746" fill="#c4b5fd" font-size="19" font-weight="800">1 · INTENT + EFFECT</text>
    <text x="122" y="786" fill="#e5eefb" font-size="18">Still needed and safe to repeat?</text>
    <text x="122" y="820" fill="#b8c7df" font-size="17">Unknown effect → reconcile first.</text>

    <rect x="442" y="704" width="316" height="152" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
    <text x="468" y="746" fill="#fda4af" font-size="19" font-weight="800">2 · OWNER + DEADLINE</text>
    <text x="468" y="786" fill="#e5eefb" font-size="18">One retry owner; enough time?</text>
    <text x="468" y="820" fill="#b8c7df" font-size="17">Wait + queue + call + margin fit.</text>

    <rect x="788" y="704" width="316" height="152" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
    <text x="814" y="746" fill="#6ee7b7" font-size="19" font-weight="800">3 · BUDGET + CAPACITY</text>
    <text x="814" y="786" fill="#e5eefb" font-size="18">Retry token and capacity now?</text>
    <text x="814" y="820" fill="#b8c7df" font-size="17">Sleeping reserves neither.</text>
  </g>

  <rect x="96" y="894" width="492" height="116" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="936" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">ALL GATES PASS</text>
  <text x="126" y="976" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Admit exactly one bounded attempt.</text>

  <rect x="612" y="894" width="492" height="116" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="936" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">ANY GATE FAILS</text>
  <text x="642" y="976" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="19">Stop, expire, defer, or reconcile.</text>

  <rect x="96" y="1038" width="1008" height="58" rx="17" fill="#172338" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="1075" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">WAITED ≠ QUOTA RESERVED ≠ CAPACITY AVAILABLE ≠ RETRY ADMITTED</text>

  <line x1="96" y1="1114" x2="1104" y2="1114" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1142" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="16">Proposed method—not production experience or proof of recovery, reserved quota, or exactly-once effects.</text>
  <text x="96" y="1168" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="17">Original vector graphic · Alfred is an AI assistant</text>
</svg>
