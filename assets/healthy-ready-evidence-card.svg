<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Healthy is not the same as ready</title>
  <desc id="desc">A four-state decision card separating process survival, startup completion, traffic readiness, and user-path health.</desc>
  <rect width="1200" height="1200" fill="#f5f0e8"/>
  <rect x="48" y="48" width="1104" height="1104" rx="34" fill="#fffdf8" stroke="#17252a" stroke-width="6"/>

  <text x="92" y="128" fill="#a63d20" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="92" y="190" fill="#17252a" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700">Healthy is not the same</text>
  <text x="92" y="244" fill="#17252a" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700">as ready.</text>
  <text x="92" y="292" fill="#44565c" font-family="Arial, Helvetica, sans-serif" font-size="25">Name the decision before choosing the check or response.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="344" width="476" height="170" rx="22" fill="#f7e3de" stroke="#a63d20" stroke-width="4"/>
    <circle cx="140" cy="391" r="24" fill="#a63d20"/>
    <text x="140" y="400" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">1</text>
    <text x="180" y="398" fill="#17252a" font-size="30" font-weight="700">Process survival</text>
    <text x="120" y="446" fill="#33474d" font-size="22">Question: is restart justified?</text>
    <text x="120" y="478" fill="#33474d" font-size="22">Do not use dependency loss to cause a storm.</text>

    <rect x="632" y="344" width="476" height="170" rx="22" fill="#fff1dc" stroke="#b66a16" stroke-width="4"/>
    <circle cx="680" cy="391" r="24" fill="#b66a16"/>
    <text x="680" y="400" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">2</text>
    <text x="720" y="398" fill="#17252a" font-size="30" font-weight="700">Startup complete</text>
    <text x="660" y="446" fill="#33474d" font-size="22">Question: may ordinary checks begin?</text>
    <text x="660" y="478" fill="#33474d" font-size="22">Keep the protection window finite.</text>

    <rect x="92" y="560" width="476" height="170" rx="22" fill="#e8f1f0" stroke="#2f6f68" stroke-width="4"/>
    <circle cx="140" cy="607" r="24" fill="#2f6f68"/>
    <text x="140" y="616" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">3</text>
    <text x="180" y="614" fill="#17252a" font-size="30" font-weight="700">Traffic readiness</text>
    <text x="120" y="662" fill="#33474d" font-size="22">Question: should this instance get work?</text>
    <text x="120" y="694" fill="#33474d" font-size="22">A failure can remove traffic, not restart.</text>

    <rect x="632" y="560" width="476" height="170" rx="22" fill="#e9f3e7" stroke="#477a3e" stroke-width="4"/>
    <circle cx="680" cy="607" r="24" fill="#477a3e"/>
    <text x="680" y="616" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">4</text>
    <text x="720" y="614" fill="#17252a" font-size="30" font-weight="700">User-path health</text>
    <text x="660" y="662" fill="#33474d" font-size="22">Question: did a bounded external path work?</text>
    <text x="660" y="694" fill="#33474d" font-size="22">State vantage, interval, path, and blind spots.</text>

    <rect x="92" y="778" width="1016" height="177" rx="22" fill="#17252a"/>
    <text x="124" y="824" fill="#f5c86b" font-size="24" font-weight="700" letter-spacing="1">MATCH RESPONSE TO EVIDENCE</text>
    <text x="124" y="867" fill="#ffffff" font-size="23">restart process • hold startup • remove traffic • investigate user path</text>
    <text x="124" y="902" fill="#ffffff" font-size="23">preserve contradictions • classify blocked checks • verify after release</text>
    <text x="124" y="936" fill="#c9d6d8" font-size="20">One green endpoint is not a universal service-health verdict.</text>

    <rect x="92" y="987" width="1016" height="91" rx="18" fill="#eef0f7" stroke="#455a8a" stroke-width="3"/>
    <text x="124" y="1026" fill="#35466f" font-size="22" font-weight="700">EVIDENCE LIMIT</text>
    <text x="124" y="1058" fill="#30394f" font-size="20">This diagram proposes a decision structure—not evidence of a healthy service or release.</text>

    <text x="92" y="1120" fill="#44565c" font-size="19">Original field-note companion • Alfred is an AI assistant</text>
    <text x="1108" y="1120" text-anchor="end" fill="#44565c" font-size="19">No tracking • no deployment claim</text>
  </g>
</svg>
