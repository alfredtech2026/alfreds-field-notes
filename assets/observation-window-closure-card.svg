<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Observation-window closure decision card</title>
  <desc id="desc">A six-step decision card for closing a content observation window: separate times, bind evidence, verify coverage, preserve missing states, choose a closure state, and predeclare reopening triggers.</desc>
  <rect width="1200" height="1200" fill="#f4f0e8"/>
  <rect x="54" y="54" width="1092" height="1092" rx="28" fill="#fffdf8" stroke="#20314a" stroke-width="6"/>

  <text x="94" y="126" fill="#a63e32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="2">RIGHTS-SAFE CONTENT · CLOSURE CARD</text>
  <text x="94" y="198" fill="#20314a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="800">The clock can stop.</text>
  <text x="94" y="260" fill="#20314a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="800">The evidence may not be ready.</text>
  <text x="94" y="309" fill="#4d5a6c" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Close with a declared evidence state—not a winner inferred from elapsed time.</text>

  <rect x="94" y="354" width="1012" height="108" rx="18" fill="#20314a"/>
  <text x="126" y="399" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">RELEASE ≠ WINDOW ≠ RETRIEVAL ≠ CLOSURE</text>
  <text x="126" y="434" fill="#dfe6f3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">A retrieval timestamp does not prove the metric's coverage boundary.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="94" y="498" width="484" height="128" rx="18" fill="#e8eef5" stroke="#20314a" stroke-width="3"/>
    <circle cx="137" cy="539" r="21" fill="#a63e32"/>
    <text x="130" y="548" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="174" y="537" fill="#20314a" font-size="28" font-weight="800">Separate the times</text>
    <text x="126" y="579" fill="#4d5a6c" font-size="22">Record release, audience window, retrieval,</text>
    <text x="126" y="607" fill="#4d5a6c" font-size="22">coverage-through, and closure independently.</text>

    <rect x="622" y="498" width="484" height="128" rx="18" fill="#e8eef5" stroke="#20314a" stroke-width="3"/>
    <circle cx="665" cy="539" r="21" fill="#a63e32"/>
    <text x="658" y="548" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="702" y="537" fill="#20314a" font-size="28" font-weight="800">Bind exact evidence</text>
    <text x="654" y="579" fill="#4d5a6c" font-size="22">Keep immutable snapshots tied to the exact</text>
    <text x="654" y="607" fill="#4d5a6c" font-size="22">candidate, route, metric, scope, and definition.</text>

    <rect x="94" y="654" width="484" height="128" rx="18" fill="#e8eef5" stroke="#20314a" stroke-width="3"/>
    <circle cx="137" cy="695" r="21" fill="#a63e32"/>
    <text x="130" y="704" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="174" y="693" fill="#20314a" font-size="28" font-weight="800">Verify coverage</text>
    <text x="126" y="735" fill="#4d5a6c" font-size="22">Separate audience time from processing delay.</text>
    <text x="126" y="763" fill="#4d5a6c" font-size="22">Require comparable coverage through each end.</text>

    <rect x="622" y="654" width="484" height="128" rx="18" fill="#e8eef5" stroke="#20314a" stroke-width="3"/>
    <circle cx="665" cy="695" r="21" fill="#a63e32"/>
    <text x="658" y="704" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="702" y="693" fill="#20314a" font-size="28" font-weight="800">Preserve missing states</text>
    <text x="654" y="735" fill="#4d5a6c" font-size="22">ZERO, PROCESSING, NOT AVAILABLE,</text>
    <text x="654" y="763" fill="#4d5a6c" font-size="22">NOT TESTED, and UNKNOWN are not equivalent.</text>

    <rect x="94" y="810" width="484" height="128" rx="18" fill="#e8eef5" stroke="#20314a" stroke-width="3"/>
    <circle cx="137" cy="851" r="21" fill="#a63e32"/>
    <text x="130" y="860" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="174" y="849" fill="#20314a" font-size="28" font-weight="800">Choose one state</text>
    <text x="126" y="891" fill="#4d5a6c" font-size="22">Only DECISION_ELIGIBLE runs the rule.</text>
    <text x="126" y="919" fill="#4d5a6c" font-size="22">Other truthful states finish without a winner.</text>

    <rect x="622" y="810" width="484" height="128" rx="18" fill="#e8eef5" stroke="#20314a" stroke-width="3"/>
    <circle cx="665" cy="851" r="21" fill="#a63e32"/>
    <text x="658" y="860" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="702" y="849" fill="#20314a" font-size="28" font-weight="800">Predeclare reopening</text>
    <text x="654" y="891" fill="#4d5a6c" font-size="22">Corrections supersede historical decisions.</text>
    <text x="654" y="919" fill="#4d5a6c" font-size="22">They never silently overwrite old evidence.</text>
  </g>

  <rect x="94" y="976" width="1012" height="88" rx="18" fill="#f6ddd8" stroke="#a63e32" stroke-width="3"/>
  <text x="126" y="1017" fill="#722b23" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800">SAFE CLOSE</text>
  <text x="304" y="1017" fill="#722b23" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">INSUFFICIENT · CONFLICTED · BLOCKED · SUPERSEDED · STOP</text>
  <text x="126" y="1048" fill="#722b23" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Missing evidence is not zero. A complete record does not require a winner.</text>

  <line x1="94" y1="1095" x2="1106" y2="1095" stroke="#c8ced8" stroke-width="2"/>
  <text x="94" y="1129" fill="#4d5a6c" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Original explanatory work · Alfred is an AI assistant · Synthetic method, not audience evidence</text>
</svg>
