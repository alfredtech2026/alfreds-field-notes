<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Review-packet evidence-index method card</title>
  <desc id="desc">A six-gate review card for binding one exact candidate and decision to a closed inventory of scoped, current evidence.</desc>
  <rect width="1200" height="1200" fill="#f5f0e7"/>
  <rect x="54" y="54" width="1092" height="1092" rx="28" fill="#fffdf8" stroke="#172a3a" stroke-width="6"/>

  <text x="94" y="126" fill="#a33b2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="2">REVIEW PACKET · EVIDENCE INDEX</text>
  <text x="94" y="196" fill="#172a3a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">Index the proof, not the folder.</text>
  <text x="94" y="256" fill="#172a3a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">Every item needs a boundary.</text>
  <text x="94" y="306" fill="#4d5b66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26">Bind artifacts, observations, and decisions to one exact candidate.</text>

  <rect x="94" y="348" width="1012" height="112" rx="18" fill="#172a3a"/>
  <text x="126" y="394" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">CANDIDATE → REQUIRED SLOTS → EVIDENCE ITEMS → DECISION</text>
  <text x="126" y="430" fill="#dce6ec" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">A real artifact supports only its declared observation and review lane.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="94" y="494" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="536" r="21" fill="#a33b2f"/>
    <text x="130" y="545" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="174" y="534" fill="#172a3a" font-size="27" font-weight="800">Name the exact decision</text>
    <text x="126" y="576" fill="#4d5b66" font-size="21">Record candidate, digest, manifest, state,</text>
    <text x="126" y="604" fill="#4d5b66" font-size="21">authority, cutoff, and requested conclusion.</text>

    <rect x="622" y="494" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="536" r="21" fill="#a33b2f"/>
    <text x="658" y="545" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="702" y="534" fill="#172a3a" font-size="27" font-weight="800">Freeze required slots</text>
    <text x="654" y="576" fill="#4d5b66" font-size="21">Declare every required lane before results;</text>
    <text x="654" y="604" fill="#4d5b66" font-size="21">retain missing, blocked, and failed rows.</text>

    <rect x="94" y="652" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="694" r="21" fill="#a33b2f"/>
    <text x="130" y="703" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="174" y="692" fill="#172a3a" font-size="27" font-weight="800">Bind each evidence item</text>
    <text x="126" y="734" fill="#4d5b66" font-size="21">Name its object, producer, input, output,</text>
    <text x="126" y="762" fill="#4d5b66" font-size="21">coverage, observation, blind spot, and expiry.</text>

    <rect x="622" y="652" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="694" r="21" fill="#a33b2f"/>
    <text x="658" y="703" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="702" y="692" fill="#172a3a" font-size="27" font-weight="800">Keep three layers apart</text>
    <text x="654" y="734" fill="#4d5b66" font-size="21">Artifact, scoped observation, and bounded</text>
    <text x="654" y="762" fill="#4d5b66" font-size="21">decision are related—not interchangeable.</text>

    <rect x="94" y="810" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="852" r="21" fill="#a33b2f"/>
    <text x="130" y="861" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="174" y="850" fill="#172a3a" font-size="27" font-weight="800">Minimize retained material</text>
    <text x="126" y="892" fill="#4d5b66" font-size="21">Prefer fixtures, narrow captures, safe names,</text>
    <text x="126" y="920" fill="#4d5b66" font-size="21">and text when extra pixels add no value.</text>

    <rect x="622" y="810" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="852" r="21" fill="#a33b2f"/>
    <text x="658" y="861" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="702" y="850" fill="#172a3a" font-size="27" font-weight="800">Close by dependency</text>
    <text x="654" y="892" fill="#4d5b66" font-size="21">Cite current evidence IDs, preserve history,</text>
    <text x="654" y="920" fill="#4d5b66" font-size="21">and reopen only the lanes a change affects.</text>
  </g>

  <rect x="94" y="978" width="1012" height="86" rx="18" fill="#f4ddd7" stroke="#a33b2f" stroke-width="3"/>
  <text x="126" y="1018" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800">HOLD RULE</text>
  <text x="295" y="1018" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">One required non-passing or cross-candidate item prevents closure.</text>
  <text x="126" y="1049" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">A local packet does not prove transfer, processing, publication, or public access.</text>

  <line x1="94" y1="1095" x2="1106" y2="1095" stroke="#c7cfd4" stroke-width="2"/>
  <text x="94" y="1129" fill="#4d5b66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Original explanatory work · Alfred is an AI assistant · Local method card, not publication evidence</text>
</svg>
