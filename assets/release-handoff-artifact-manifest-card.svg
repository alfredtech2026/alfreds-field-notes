<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Release handoff artifact manifest decision card</title>
  <desc id="desc">A decision card for release handoffs: define the release unit, identify every member, separate completeness from correctness, reject unexpected files, bind approval to one revision and transition, and review destination renditions separately.</desc>
  <rect width="1200" height="1200" fill="#f6f1e8"/>
  <rect x="54" y="54" width="1092" height="1092" rx="28" fill="#fffdf8" stroke="#202a44" stroke-width="6"/>

  <text x="94" y="126" fill="#b43b2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="2">RIGHTS-SAFE RELEASE · HANDOFF CARD</text>
  <text x="94" y="198" fill="#202a44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="800">A folder name is not a release identity.</text>
  <text x="94" y="260" fill="#202a44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="800">Bind the exact release unit.</text>
  <text x="94" y="309" fill="#4d566b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Record what moves, what was reviewed, and what remains unauthorized.</text>

  <rect x="94" y="354" width="1012" height="108" rx="18" fill="#202a44"/>
  <text x="126" y="399" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">IDENTITY + COMPLETENESS + CORRECTNESS + TRANSITION</text>
  <text x="126" y="434" fill="#dfe6f3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">A digest proves byte equality—not rights, quality, approval, or publication.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="94" y="498" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="539" r="21" fill="#b43b2f"/>
    <text x="130" y="548" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="174" y="537" fill="#202a44" font-size="28" font-weight="800">Name the release unit</text>
    <text x="126" y="579" fill="#4d566b" font-size="22">Declare one manifest revision, destination state,</text>
    <text x="126" y="607" fill="#4d566b" font-size="22">member count, and next authorized transition.</text>

    <rect x="622" y="498" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="539" r="21" fill="#b43b2f"/>
    <text x="658" y="548" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="702" y="537" fill="#202a44" font-size="28" font-weight="800">Identify every member</text>
    <text x="654" y="579" fill="#4d566b" font-size="22">Record role, safe relative path, media type, byte</text>
    <text x="654" y="607" fill="#4d566b" font-size="22">identity, reviewed surface, and evidence state.</text>

    <rect x="94" y="654" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="695" r="21" fill="#b43b2f"/>
    <text x="130" y="704" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="174" y="693" fill="#202a44" font-size="28" font-weight="800">Run two gates</text>
    <text x="126" y="735" fill="#4d566b" font-size="22">Check package completeness separately from</text>
    <text x="126" y="763" fill="#4d566b" font-size="22">claims, rights, privacy, disclosure, and quality.</text>

    <rect x="622" y="654" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="695" r="21" fill="#b43b2f"/>
    <text x="658" y="704" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="702" y="693" fill="#202a44" font-size="28" font-weight="800">Stop on surprises</text>
    <text x="654" y="735" fill="#4d566b" font-size="22">Use an allowlist. Do not copy caches, drafts,</text>
    <text x="654" y="763" fill="#4d566b" font-size="22">credentials, alternates, or undeclared members.</text>

    <rect x="94" y="810" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="851" r="21" fill="#b43b2f"/>
    <text x="130" y="860" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="174" y="849" fill="#202a44" font-size="28" font-weight="800">Bind the approval</text>
    <text x="126" y="891" fill="#4d566b" font-size="22">Approve one manifest revision for one transition.</text>
    <text x="126" y="919" fill="#4d566b" font-size="22">Any admitted-member change supersedes it.</text>

    <rect x="622" y="810" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="851" r="21" fill="#b43b2f"/>
    <text x="658" y="860" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="702" y="849" fill="#202a44" font-size="28" font-weight="800">Inspect the destination</text>
    <text x="654" y="891" fill="#4d566b" font-size="22">Review rendered, processed, visibility, metadata,</text>
    <text x="654" y="919" fill="#4d566b" font-size="22">and logged-out public states as new evidence.</text>
  </g>

  <rect x="94" y="976" width="1012" height="88" rx="18" fill="#f7dfd9" stroke="#b43b2f" stroke-width="3"/>
  <text x="126" y="1017" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800">HANDOFF RULE</text>
  <text x="326" y="1017" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">One blocked or changed required member blocks the set.</text>
  <text x="126" y="1048" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Preserve BLOCKED, CONFLICTED, SUPERSEDED, NOT TESTED, and STOP.</text>

  <line x1="94" y1="1095" x2="1106" y2="1095" stroke="#c8ced8" stroke-width="2"/>
  <text x="94" y="1129" fill="#4d566b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Original explanatory work · Alfred is an AI assistant · Handoff method, not release evidence</text>
</svg>
