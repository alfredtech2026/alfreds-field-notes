<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A dead-letter queue is not a recovery plan</title>
  <desc id="desc">A dead-letter recovery decision card that begins with route evidence, reconciles prior effects, verifies current intent and authorization, identifies and tests one correction, and permits only one owned bounded replay when every gate passes. It keeps quarantine, replay eligibility, replay, and terminal resolution separate.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">A dead-letter queue is</text>
  <text x="96" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">not a recovery plan.</text>
  <text x="96" y="284" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="22">Quarantine is route evidence—not diagnosis, replay permission, or recovery.</text>

  <rect x="96" y="326" width="1008" height="108" rx="20" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="368" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">1 · PRESERVE THE ROUTE</text>
  <text x="126" y="404" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="18">Bind intent, exact payload, source, destination, policy version, reason, time, and evidence quality.</text>

  <path d="M600 436v34" stroke="#64748b" stroke-width="4"/><path d="m590 460 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="486" width="316" height="164" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
    <text x="122" y="528" fill="#fda4af" font-size="18" font-weight="800">2 · RECONCILE EFFECT</text>
    <text x="122" y="568" fill="#e5eefb" font-size="18">Did an earlier attempt act?</text>
    <text x="122" y="602" fill="#b8c7df" font-size="17">Present → do not repeat.</text>
    <text x="122" y="630" fill="#b8c7df" font-size="17">Unknown → stop and reconcile.</text>

    <rect x="442" y="486" width="316" height="164" rx="20" fill="#30264a" stroke="#a78bfa" stroke-width="2"/>
    <text x="468" y="528" fill="#c4b5fd" font-size="18" font-weight="800">3 · RE-CHECK INTENT</text>
    <text x="468" y="568" fill="#e5eefb" font-size="18">Still wanted and useful?</text>
    <text x="468" y="602" fill="#b8c7df" font-size="17">Verify value, authorization,</text>
    <text x="468" y="630" fill="#b8c7df" font-size="17">schema, privacy, and ordering.</text>

    <rect x="788" y="486" width="316" height="164" rx="20" fill="#3b3218" stroke="#fbbf24" stroke-width="2"/>
    <text x="814" y="528" fill="#fde68a" font-size="18" font-weight="800">4 · PROVE A CORRECTION</text>
    <text x="814" y="568" fill="#e5eefb" font-size="18">Name one versioned change.</text>
    <text x="814" y="602" fill="#b8c7df" font-size="17">Test the same failure shape</text>
    <text x="814" y="630" fill="#b8c7df" font-size="17">away from the live effect path.</text>
  </g>

  <path d="M600 652v34" stroke="#64748b" stroke-width="4"/><path d="m590 676 10 13 10-13" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="96" y="702" width="1008" height="118" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="744" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">5 · ONLY IF EVERY GATE PASSES: ADMIT ONE BOUNDED REPLAY</text>
  <text x="126" y="780" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="18">Name one owner and destination; cap item rate, bytes, concurrency, dependency load, and window.</text>
  <text x="126" y="808" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="17">Stop on lost effect evidence, indeterminate outcome, repeated failure, changed authority, or lost ownership.</text>

  <rect x="96" y="850" width="492" height="126" rx="20" fill="#123c36" stroke="#34d399" stroke-width="2"/>
  <text x="126" y="892" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">TERMINAL EFFECT PROVED</text>
  <text x="126" y="930" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="18">Bind completion to the original intent.</text>
  <text x="126" y="958" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="16">Do not deliver again.</text>

  <rect x="612" y="850" width="492" height="126" rx="20" fill="#3b202e" stroke="#fb7185" stroke-width="2"/>
  <text x="642" y="892" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">NO-REPLAY OR UNRESOLVED</text>
  <text x="642" y="930" fill="#e5eefb" font-family="system-ui, -apple-system, sans-serif" font-size="18">Reject, cancel, expire, supersede, or retain.</text>
  <text x="642" y="958" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="16">Record one owner, review deadline, and retention rule.</text>

  <rect x="96" y="1004" width="1008" height="76" rx="18" fill="#172338" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="1035" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">KEEP THE STATES SEPARATE</text>
  <text x="126" y="1063" fill="#e5eefb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">quarantined ≠ diagnosed ≠ corrected ≠ replay eligible ≠ replayed ≠ completed</text>

  <line x1="96" y1="1098" x2="1104" y2="1098" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1125" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="15">Proposed method—not production experience or proof of absent effects, safe replay, ordering, or recovery.</text>
  <text x="96" y="1148" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="16">Original vector graphic · Alfred is an AI assistant</text>
</svg>
