<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Vertical-video adversarial-mask review method card</title>
  <desc id="desc">A six-gate method card for checking essential vertical-video content against explicit conservative masks, semantic and motion boundaries, separate geometry, contrast, meaning, and playback passes, synthetic failure fixtures, and exact-candidate evidence.</desc>
  <rect width="1200" height="1200" fill="#f5f0e7"/>
  <rect x="54" y="54" width="1092" height="1092" rx="28" fill="#fffdf8" stroke="#172a3a" stroke-width="6"/>

  <text x="94" y="126" fill="#a33b2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="2">VERTICAL VIDEO · ADVERSARIAL MASKS</text>
  <text x="94" y="196" fill="#172a3a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">Test edge dependence,</text>
  <text x="94" y="256" fill="#172a3a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">not one clean frame.</text>
  <text x="94" y="306" fill="#4d5b66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26">Conservative masks expose claims that rely on uncertain player space.</text>

  <rect x="94" y="348" width="1012" height="112" rx="18" fill="#172a3a"/>
  <text x="126" y="394" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">CANDIDATE × CONTENT × MASK SET × SAMPLE MAP × PASS</text>
  <text x="126" y="430" fill="#dce6ec" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">A local envelope is a falsifiable design test, not a platform guarantee.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="94" y="494" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="536" r="21" fill="#a33b2f"/>
    <text x="130" y="545" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="174" y="534" fill="#172a3a" font-size="27" font-weight="800">Classify by meaning</text>
    <text x="126" y="576" fill="#4d5b66" font-size="21">Separate essential claims, disclosures,</text>
    <text x="126" y="604" fill="#4d5b66" font-size="21">navigation, supporting detail, and decoration.</text>

    <rect x="622" y="494" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="536" r="21" fill="#a33b2f"/>
    <text x="658" y="545" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="702" y="534" fill="#172a3a" font-size="27" font-weight="800">Version every mask set</text>
    <text x="654" y="576" fill="#4d5b66" font-size="21">Record coordinates, basis, scope, expiry,</text>
    <text x="654" y="604" fill="#4d5b66" font-size="21">and observed versus conservative regions.</text>

    <rect x="94" y="652" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="694" r="21" fill="#a33b2f"/>
    <text x="130" y="703" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="174" y="692" fill="#172a3a" font-size="27" font-weight="800">Sample boundaries</text>
    <text x="126" y="734" fill="#4d5b66" font-size="21">Check claim starts, midpoints, ends, transitions,</text>
    <text x="126" y="762" fill="#4d5b66" font-size="21">peak motion, disclosures, and caption changes.</text>

    <rect x="622" y="652" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="694" r="21" fill="#a33b2f"/>
    <text x="658" y="703" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="702" y="692" fill="#172a3a" font-size="27" font-weight="800">Keep four passes separate</text>
    <text x="654" y="734" fill="#4d5b66" font-size="21">Record geometry, contrast, meaning, and</text>
    <text x="654" y="762" fill="#4d5b66" font-size="21">masked-plus-clean playback independently.</text>

    <rect x="94" y="810" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="137" cy="852" r="21" fill="#a33b2f"/>
    <text x="130" y="861" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="174" y="850" fill="#172a3a" font-size="27" font-weight="800">Prove the harness can fail</text>
    <text x="126" y="892" fill="#4d5b66" font-size="21">Run synthetic bad layouts: covered qualifiers,</text>
    <text x="126" y="920" fill="#4d5b66" font-size="21">caption collisions, contrast loss, and stale evidence.</text>

    <rect x="622" y="810" width="484" height="130" rx="18" fill="#e7eef2" stroke="#172a3a" stroke-width="3"/>
    <circle cx="665" cy="852" r="21" fill="#a33b2f"/>
    <text x="658" y="861" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="702" y="850" fill="#172a3a" font-size="27" font-weight="800">Bind and invalidate</text>
    <text x="654" y="892" fill="#4d5b66" font-size="21">Tie results to exact bytes, timeline, captions,</text>
    <text x="654" y="920" fill="#4d5b66" font-size="21">masks, outputs, decision, and recheck triggers.</text>
  </g>

  <rect x="94" y="978" width="1012" height="86" rx="18" fill="#f4ddd7" stroke="#a33b2f" stroke-width="3"/>
  <text x="126" y="1018" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800">FAIL CLOSED</text>
  <text x="312" y="1018" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">One covered qualifier can reverse the meaning of a clean-looking frame.</text>
  <text x="126" y="1049" fill="#71271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Unknown destination overlays or captions remain NOT TESTED or UNCERTAIN.</text>

  <line x1="94" y1="1095" x2="1106" y2="1095" stroke="#c7cfd4" stroke-width="2"/>
  <text x="94" y="1129" fill="#4d5b66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Original explanatory work · Alfred is an AI assistant · Local method card, not publication evidence</text>
</svg>
