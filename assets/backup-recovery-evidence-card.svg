<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">A backup is not a recovery result</title>
  <desc id="desc">A recovery-evidence control card that separates artifact production, accessibility, structural restoration, data validation, service validation, and a measured recovery objective. It proposes an isolated restore drill and does not claim that any backup is recoverable.</desc>
  <rect width="1200" height="1200" fill="#08111f"/>
  <rect x="56" y="52" width="1088" height="1096" rx="32" fill="#111c30" stroke="#33445f" stroke-width="2"/>

  <text x="96" y="122" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS</text>
  <text x="96" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800">A backup is not</text>
  <text x="96" y="240" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800">a recovery result.</text>
  <text x="96" y="286" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="24">Restore one named artifact against one declared objective.</text>

  <text x="96" y="354" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="750">Keep every evidence layer explicit</text>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="96" y="382" width="306" height="104" rx="18" fill="#192f4a" stroke="#60a5fa" stroke-width="2"/>
    <text x="120" y="422" fill="#93c5fd" font-size="21" font-weight="800">1 · ARTIFACT PRODUCED</text>
    <text x="120" y="458" fill="#e5eefb" font-size="18">Expected objects exist.</text>

    <path d="M414 434h50" stroke="#64748b" stroke-width="4"/><path d="m456 426 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="476" y="382" width="306" height="104" rx="18" fill="#233149" stroke="#818cf8" stroke-width="2"/>
    <text x="500" y="422" fill="#a5b4fc" font-size="21" font-weight="800">2 · ARTIFACT ACCESSIBLE</text>
    <text x="500" y="458" fill="#e5eefb" font-size="18">Restore role gets all parts.</text>

    <path d="M794 434h50" stroke="#64748b" stroke-width="4"/><path d="m836 426 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="856" y="382" width="248" height="104" rx="18" fill="#3c291d" stroke="#fb923c" stroke-width="2"/>
    <text x="880" y="422" fill="#fdba74" font-size="20" font-weight="800">3 · RESTORED</text>
    <text x="880" y="458" fill="#e5eefb" font-size="18">Engine accepts state.</text>

    <rect x="96" y="516" width="306" height="104" rx="18" fill="#30284a" stroke="#a78bfa" stroke-width="2"/>
    <text x="120" y="556" fill="#c4b5fd" font-size="21" font-weight="800">4 · DATA VALIDATED</text>
    <text x="120" y="592" fill="#e5eefb" font-size="18">Named invariants pass.</text>

    <path d="M414 568h50" stroke="#64748b" stroke-width="4"/><path d="m456 560 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="476" y="516" width="306" height="104" rx="18" fill="#123c36" stroke="#34d399" stroke-width="2"/>
    <text x="500" y="556" fill="#6ee7b7" font-size="21" font-weight="800">5 · SERVICE VALIDATED</text>
    <text x="500" y="592" fill="#e5eefb" font-size="18">Critical paths work.</text>

    <path d="M794 568h50" stroke="#64748b" stroke-width="4"/><path d="m836 560 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="856" y="516" width="248" height="104" rx="18" fill="#164236" stroke="#6ee7b7" stroke-width="2"/>
    <text x="880" y="556" fill="#a7f3d0" font-size="20" font-weight="800">6 · OBJECTIVE MET</text>
    <text x="880" y="592" fill="#e5eefb" font-size="18">Point + time measured.</text>
  </g>

  <rect x="96" y="662" width="1008" height="112" rx="20" fill="#43202a" stroke="#fb7185" stroke-width="2"/>
  <text x="126" y="706" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">DO NOT INHERIT GREEN</text>
  <text x="126" y="744" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="21">Blocked · not run · failed · indeterminate — preserve each result at its own layer.</text>

  <rect x="96" y="812" width="492" height="190" rx="22" fill="#172338" stroke="#475569" stroke-width="2"/>
  <text x="126" y="858" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="750">Declare before the drill</text>
  <g fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="20">
    <text x="126" y="900">• Protected scope + artifact set</text>
    <text x="126" y="936">• Recovery point + time objective</text>
    <text x="126" y="972">• Clock boundaries + critical paths</text>
  </g>

  <rect x="612" y="812" width="492" height="190" rx="22" fill="#172338" stroke="#475569" stroke-width="2"/>
  <text x="642" y="858" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="750">Exercise in isolation</text>
  <g fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="20">
    <text x="642" y="900">• Retrieve base, logs, manifest + key</text>
    <text x="642" y="936">• Record actual replay endpoint</text>
    <text x="642" y="972">• Test integrity + safe user paths</text>
  </g>

  <line x1="96" y1="1042" x2="1104" y2="1042" stroke="#334155" stroke-width="2"/>
  <text x="96" y="1083" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Evidence boundary:</text>
  <text x="266" y="1083" fill="#b8c7df" font-family="system-ui, -apple-system, sans-serif" font-size="19">One passing drill is bounded evidence—not a promise about the next incident.</text>
  <text x="96" y="1123" fill="#7f91ac" font-family="system-ui, -apple-system, sans-serif" font-size="18">Original vector graphic · Proposed method · Original work by Alfred</text>
</svg>
