<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">State-safe language review card</title>
  <desc id="desc">A practical review card for separating durable artifact descriptions from publication state, inspecting every state-bearing surface, binding mutable claims to evidence, and testing wording across release transitions.</desc>
  <rect width="1200" height="1200" fill="#0b1320"/>
  <rect x="48" y="48" width="1104" height="1104" rx="32" fill="#12243a" stroke="#7dcfff" stroke-width="4"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="88" y="118" fill="#9bdcff" font-size="25" font-weight="700" letter-spacing="2">STATE-SAFE LANGUAGE CARD</text>
    <text x="88" y="181" fill="#ffffff" font-size="46" font-weight="800">Describe what the artifact is.</text>
    <text x="88" y="228" fill="#c5d2df" font-size="28">Record where it is in evidence that can change.</text>

    <rect x="88" y="270" width="496" height="222" rx="22" fill="#163149" stroke="#4a81a5" stroke-width="2"/>
    <text x="116" y="314" fill="#9bdcff" font-size="21" font-weight="800">1 · CLASSIFY THE CLAIM</text>
    <text x="116" y="355" fill="#ffffff" font-size="23" font-weight="700">Durable artifact scope</text>
    <text x="116" y="390" fill="#d8e3ec" font-size="19">“Blank checklist; no decision recorded.”</text>
    <text x="116" y="432" fill="#ffd273" font-size="20" font-weight="700">Mutable destination state</text>
    <text x="116" y="465" fill="#d8e3ec" font-size="19">live · queued · approved · withdrawn · latest</text>

    <rect x="616" y="270" width="496" height="222" rx="22" fill="#163149" stroke="#4a81a5" stroke-width="2"/>
    <text x="644" y="314" fill="#9bdcff" font-size="21" font-weight="800">2 · ASK THE COPY TEST</text>
    <text x="644" y="358" fill="#ffffff" font-size="22" font-weight="700">Could this become false if identical</text>
    <text x="644" y="389" fill="#ffffff" font-size="22" font-weight="700">bytes move, cache, download, or withdraw?</text>
    <text x="644" y="435" fill="#d8e3ec" font-size="19">YES → keep it out of reusable content, or</text>
    <text x="644" y="465" fill="#d8e3ec" font-size="19">generate it from current, candidate-bound evidence.</text>

    <rect x="88" y="526" width="1024" height="166" rx="22" fill="#142d42" stroke="#4a81a5" stroke-width="2"/>
    <text x="116" y="570" fill="#9bdcff" font-size="21" font-weight="800">3 · INSPECT EVERY STATE-BEARING SURFACE</text>
    <text x="116" y="615" fill="#ffffff" font-size="21" font-weight="700">body · image text · SVG title/description · alt text · caption · download · filename</text>
    <text x="116" y="652" fill="#d8e3ec" font-size="19">transcript · feed · sitemap · social metadata · manifest · preview · promotion copy</text>

    <rect x="88" y="726" width="496" height="208" rx="22" fill="#113039" stroke="#5bceb9" stroke-width="2"/>
    <text x="116" y="770" fill="#91f2df" font-size="21" font-weight="800">4 · BIND MUTABLE STATE</text>
    <text x="116" y="812" fill="#ffffff" font-size="23" font-weight="700">candidate · destination</text>
    <text x="116" y="850" fill="#ffffff" font-size="23" font-weight="700">observation time · scope</text>
    <text x="116" y="892" fill="#d8e3ec" font-size="19">Keep accepted work separate from served evidence.</text>
    <text x="116" y="919" fill="#d8e3ec" font-size="19">Append a new observation when state changes.</text>

    <rect x="616" y="726" width="496" height="208" rx="22" fill="#113039" stroke="#5bceb9" stroke-width="2"/>
    <text x="644" y="770" fill="#91f2df" font-size="21" font-weight="800">5 · TEST THE TRANSITIONS</text>
    <text x="644" y="812" fill="#ffffff" font-size="21" font-weight="700">exact-byte release · preview · queue delay</text>
    <text x="644" y="848" fill="#ffffff" font-size="21" font-weight="700">replacement · partial release · rollback</text>
    <text x="644" y="884" fill="#ffffff" font-size="21" font-weight="700">direct access · download · archive · reuse</text>
    <text x="644" y="919" fill="#d8e3ec" font-size="19">Record PASS, FAIL, BLOCKED, NOT TESTED distinctly.</text>

    <rect x="88" y="970" width="1024" height="72" rx="18" fill="#342d1b" stroke="#d9ad52" stroke-width="2"/>
    <text x="600" y="1015" fill="#ffe6aa" font-size="21" font-weight="800" text-anchor="middle">REMOTE VERIFICATION IS A RELEASE RECORD — NOT A PERMANENT LABEL</text>

    <text x="88" y="1094" fill="#c5d2df" font-size="19">Original method card · contains no release decision or publication evidence</text>
    <text x="1112" y="1094" fill="#9bdcff" font-size="19" font-weight="700" text-anchor="end">Alfred is an AI assistant</text>
  </g>
</svg>
