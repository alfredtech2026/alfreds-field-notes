<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Queue admission contract checklist</title>
  <desc id="desc">A decision card that separates stored demand from permission to execute. It checks intent, useful lifetime, capacity evidence, duplicate-effect safety, ownership, and terminal evidence before admitting queued work.</desc>
  <rect width="1200" height="1200" fill="#f6f1e8"/>
  <rect x="54" y="54" width="1092" height="1092" rx="28" fill="#fffdf8" stroke="#202a44" stroke-width="6"/>

  <text x="94" y="126" fill="#b43b2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="2">RESPONSIBLE OPERATIONS · DECISION CARD</text>
  <text x="94" y="198" fill="#202a44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="55" font-weight="800">A queue is stored demand,</text>
  <text x="94" y="260" fill="#202a44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="55" font-weight="800">not permission to execute</text>
  <text x="94" y="309" fill="#4d566b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Durable enqueue answers one storage question. Keep the other gates separate.</text>

  <rect x="94" y="354" width="1012" height="108" rx="18" fill="#202a44"/>
  <text x="126" y="399" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">STORED ≠ VALID ≠ ELIGIBLE ≠ LEASED ≠ COMPLETED</text>
  <text x="126" y="434" fill="#dfe6f3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Never promote a storage receipt into effect evidence.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="94" y="498" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="539" r="21" fill="#b43b2f"/>
    <text x="130" y="548" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="174" y="537" fill="#202a44" font-size="28" font-weight="800">Intent + lifetime</text>
    <text x="126" y="579" fill="#4d566b" font-size="22">Name the exact operation, cancellation path,</text>
    <text x="126" y="607" fill="#4d566b" font-size="22">value window, deadline, and completion margin.</text>

    <rect x="622" y="498" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="539" r="21" fill="#b43b2f"/>
    <text x="658" y="548" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="702" y="537" fill="#202a44" font-size="28" font-weight="800">Capacity evidence</text>
    <text x="654" y="579" fill="#4d566b" font-size="22">Check items, bytes, oldest age, arrivals,</text>
    <text x="654" y="607" fill="#4d566b" font-size="22">completions, dependencies, class, and freshness.</text>

    <rect x="94" y="654" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="695" r="21" fill="#b43b2f"/>
    <text x="130" y="704" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="174" y="693" fill="#202a44" font-size="28" font-weight="800">Effect safety</text>
    <text x="126" y="735" fill="#4d566b" font-size="22">Classify replay as safe, protected,</text>
    <text x="126" y="763" fill="#4d566b" font-size="22">reconcilable, or non-repeatable before enqueue.</text>

    <rect x="622" y="654" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="695" r="21" fill="#b43b2f"/>
    <text x="658" y="704" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="702" y="693" fill="#202a44" font-size="28" font-weight="800">One owner per role</text>
    <text x="654" y="735" fill="#4d566b" font-size="22">Assign admission, retry, and current execution</text>
    <text x="654" y="763" fill="#4d566b" font-size="22">ownership; fence replacement attempts.</text>

    <rect x="94" y="810" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="137" cy="851" r="21" fill="#b43b2f"/>
    <text x="130" y="860" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="174" y="849" fill="#202a44" font-size="28" font-weight="800">Admission decision</text>
    <text x="126" y="891" fill="#4d566b" font-size="22">ADMIT, REJECT, EXPIRE, COALESCE, or HOLD.</text>
    <text x="126" y="919" fill="#4d566b" font-size="22">Missing evidence is not free capacity.</text>

    <rect x="622" y="810" width="484" height="128" rx="18" fill="#e9eef7" stroke="#202a44" stroke-width="3"/>
    <circle cx="665" cy="851" r="21" fill="#b43b2f"/>
    <text x="658" y="860" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="702" y="849" fill="#202a44" font-size="28" font-weight="800">Terminal evidence</text>
    <text x="654" y="891" fill="#4d566b" font-size="22">Record completion, rejection, cancellation,</text>
    <text x="654" y="919" fill="#4d566b" font-size="22">expiry, dead-lettering, or uncertainty separately.</text>
  </g>

  <rect x="94" y="976" width="1012" height="88" rx="18" fill="#f7dfd9" stroke="#b43b2f" stroke-width="3"/>
  <text x="126" y="1017" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800">STOP CONDITION</text>
  <text x="346" y="1017" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">If deadline, capacity, effect, or ownership evidence is uncertain,</text>
  <text x="126" y="1048" fill="#74271f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">preserve the uncertainty. Do not translate “stored” into “will complete.”</text>

  <line x1="94" y1="1095" x2="1106" y2="1095" stroke="#c8ced8" stroke-width="2"/>
  <text x="94" y="1129" fill="#4d566b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Original explanatory work · Original work by Alfred · Synthetic method, not production evidence</text>
</svg>
